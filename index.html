    function ensureRuntimeFallbacks() {
      if (typeof window.Chart === "undefined") {
        window.Chart = function () {
          return { destroy() {} };
        };
        console.warn("Chart.js 載入失敗，已切換為無圖模式");
      }
      if (typeof window.html2canvas === "undefined") {
        window.html2canvas = async function (el) {
          const canvas = document.createElement("canvas");
          canvas.width = 1000;
          canvas.height = 1400;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#111827";
          ctx.font = "28px sans-serif";
          ctx.fillText("html2canvas 未載入，使用簡化 PDF 匯出", 40, 80);
          if (el) {
            ctx.font = "20px sans-serif";
            ctx.fillText(String(el.querySelector("h2,h3")?.textContent || "Smart Care 報告"), 40, 130);
          }
          return canvas;
        };
      }
      if (typeof window.jspdf === "undefined") {

    let cloudPushTimer = null;
    let cloudPullTimer = null;
    let cloudPushInFlight = false;
    let cloudReconcileInFlight = false;
    let cloudHydrationReady = !CLOUD_SYNC_ENABLED;
    let isApplyingCloudState = false;
    let isApplyingStorageState = false;
    let isProgrammaticOperatorUpdate = false;
    let safeRenderTimer = null;

    function getDeviceId() {
      const cached = localStorage.getItem(DEVICE_KEY);
      if (cached) return cached;
      const next = id();
      localStorage.setItem(DEVICE_KEY, next);
      return next;
    }

    function sanitizeSyncKey(raw) {
      const normalized = String(raw || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "-").replace(/-{2,}/g, "-");
      if (!normalized) return "";
      return normalized.slice(0, 64);
    }

    function resolveCloudSyncKey() {
      const fromUrl = sanitizeSyncKey(new URL(location.href).searchParams.get(CLOUD_SYNC_KEY_PARAM));
      if (fromUrl) {
        localStorage.setItem(CLOUD_SYNC_KEY_STORAGE, fromUrl);
        return fromUrl;
      }
      const fallbackKey = DEFAULT_CLOUD_SYNC_KEY || "center-a";
      localStorage.setItem(CLOUD_SYNC_KEY_STORAGE, fallbackKey);
      return fallbackKey;
    }

    function sanitizeCloudSyncBaseUrl(raw) {
      const value = String(raw || "").trim();
      if (!value) return "";
      if (value.startsWith("/")) return value.replace(/\/+$/, "");
      try {
        const parsed = new URL(value);
        if (parsed.protocol !== "https:") return "";
        const normalized = `${parsed.origin}${parsed.pathname}`.replace(/\/+$/, "");
        const currentPage = `${location.origin}${location.pathname}`.replace(/\/+$/, "");
        if (location.hostname.endsWith(".github.io") && normalized === currentPage) return "";
        parsed.hash = "";
        if (/^https:\/\/smart-care-sync-api\.j9zrzt95b6\.workers\.dev(\/.*)?$/.test(value)) {
          return "https://smart-care-sync.j9zrzt95b6.workers.dev/state";
        }
        return normalized;
      } catch {
        return "";
      }
    }

    function resolveCloudSyncBaseUrl() {
      const url = new URL(location.href);
      const fromUrl = sanitizeCloudSyncBaseUrl(url.searchParams.get(CLOUD_SYNC_BASE_URL_PARAM));
      if (fromUrl) {
        localStorage.setItem(CLOUD_SYNC_BASE_URL_STORAGE, fromUrl);
        return fromUrl;
      }
      const fromStorage = sanitizeCloudSyncBaseUrl(localStorage.getItem(CLOUD_SYNC_BASE_URL_STORAGE));
      if (fromStorage && !ALTERNATE_CLOUD_SYNC_BASE_URLS.includes(fromStorage)) return fromStorage;
      return DEFAULT_CLOUD_SYNC_BASE_URL;
    }

    function isCloudSyncConfigured() {
      return CLOUD_SYNC_ENABLED && !!cloudSyncBaseUrl;
    }

    function getCloudSyncUrl() {
      if (!cloudSyncBaseUrl) return "";
      const separator = cloudSyncBaseUrl.includes("?") ? "&" : "?";
      return `${cloudSyncBaseUrl}${separator}key=${encodeURIComponent(cloudSyncKey)}`;
    }

    function getShareSyncLink() {
      const url = new URL(location.href);
      const targetKey = sanitizeSyncKey(cloudSyncKey) || "center-a";
      url.searchParams.set(CLOUD_SYNC_KEY_PARAM, targetKey);
      if (cloudSyncBaseUrl && !cloudSyncBaseUrl.startsWith("/")) {
        url.searchParams.set(CLOUD_SYNC_BASE_URL_PARAM, cloudSyncBaseUrl);
      }
      return url.toString();
    }

    function getSyncKeyHue(value) {
      const input = String(value || "");
      let hash = 0;
      for (let i = 0; i < input.length; i++) {
        hash = ((hash << 5) - hash) + input.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % 360;
    }

    function renderSyncKeyBadge() {
      const el = document.getElementById("syncKeyBadge");
      if (!el) return;
      const key = cloudSyncKey || DEFAULT_CLOUD_SYNC_KEY;
      const hue = getSyncKeyHue(key);
      el.textContent = `共享群組：${key}`;
      el.style.background = `hsl(${hue} 100% 96%)`;
      el.style.color = `hsl(${hue} 65% 28%)`;
      el.style.borderColor = `hsl(${hue} 50% 78%)`;
      updateCloudSyncBadge();
    }

    function setCloudSyncKey(nextKey, { updateUrl = false } = {}) {
      const sanitized = sanitizeSyncKey(nextKey);
      if (!sanitized) return false;
      if (cloudSyncKey === sanitized) return true;
      cloudSyncKey = sanitized;
      localStorage.setItem(CLOUD_SYNC_KEY_STORAGE, sanitized);
      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set(CLOUD_SYNC_KEY_PARAM, sanitized);
        if (cloudSyncBaseUrl && !cloudSyncBaseUrl.startsWith("/")) {
          url.searchParams.set(CLOUD_SYNC_BASE_URL_PARAM, cloudSyncBaseUrl);
        }
        history.replaceState(null, "", url.toString());
      }
      cloudHydrationReady = !isCloudSyncConfigured();
      renderSyncKeyBadge();
      return true;
    }

    function setCloudSyncBaseUrl(nextBaseUrl, { updateUrl = false } = {}) {
      const sanitized = sanitizeCloudSyncBaseUrl(nextBaseUrl);
      if (!sanitized && nextBaseUrl) return false;
      cloudSyncBaseUrl = sanitized;
      if (sanitized) localStorage.setItem(CLOUD_SYNC_BASE_URL_STORAGE, sanitized);
      else localStorage.removeItem(CLOUD_SYNC_BASE_URL_STORAGE);

      if (updateUrl) {
        const url = new URL(location.href);
        if (sanitized && !sanitized.startsWith("/")) {
          url.searchParams.set(CLOUD_SYNC_BASE_URL_PARAM, sanitized);
        } else {
          url.searchParams.delete(CLOUD_SYNC_BASE_URL_PARAM);
        }
        history.replaceState(null, "", url.toString());
      }

      cloudHydrationReady = !isCloudSyncConfigured();
      return true;
    }

    function setSyncStatus(text) {
      const el = document.getElementById("syncStatusText");
      if (!el) return;
      el.textContent = text;
      if (/失敗/.test(text)) {
        el.dataset.state = "error";
        el.style.background = "#fee2e2";
        el.style.color = "#991b1b";
        el.style.borderColor = "#fca5a5";
      } else if (/同步中|讀取|寫入|合併|切換/.test(text)) {
        el.dataset.state = "syncing";
        el.style.background = "#fef3c7";
        el.style.color = "#92400e";
        el.style.borderColor = "#fcd34d";
      } else {
        el.dataset.state = "ready";
        el.style.background = "#dcfce7";
        el.style.color = "#166534";
        el.style.borderColor = "#86efac";
      }
      updateSyncMetaBadge();
    }

    function updateCloudSyncBadge() {
      const badge = document.getElementById("syncStatusBadge");
      if (!badge) return;
      const label = isCloudSyncConfigured() ? `雲端同步：${cloudSyncKey}` : "雲端同步：未啟用";
      badge.textContent = label;
      badge.title = isCloudSyncConfigured() ? `同步碼 ${cloudSyncKey}` : "尚未設定同步 API";
      badge.style.background = isCloudSyncConfigured() ? "#dcfce7" : "#fef3c7";
      badge.style.color = isCloudSyncConfigured() ? "#166534" : "#92400e";
      badge.style.borderColor = isCloudSyncConfigured() ? "#86efac" : "#fcd34d";
    }

    function formatLastSyncTime(value) {
      const ms = Number(value || 0);
      if (!ms) return "尚未同步";
      const date = new Date(ms);
      if (Number.isNaN(date.getTime())) return "尚未同步";
      return date.toLocaleString("zh-TW", { hour12: false });
    }

    function updateSyncMetaBadge() {
      const badge = document.getElementById("syncMetaBadge");
      if (!badge) return;
      const groupKey = sanitizeSyncKey(cloudSyncKey) || DEFAULT_CLOUD_SYNC_KEY || "center-a";
      const lastSyncLabel = formatLastSyncTime(getLastSyncedAt(state._meta));
      badge.textContent = `共享群組：${groupKey} · 最後同步：${lastSyncLabel}`;
      badge.title = `目前共享群組 ${groupKey}`;
      badge.style.background = "#f8fafc";
      badge.style.color = "#334155";
      badge.style.borderColor = "#cbd5e1";
    }

    function nowClock() {
      return new Date().toLocaleTimeString("zh-TW", { hour12: false });
    }

    function getLastSyncedAt(meta = state._meta) {
      return Number(meta && (meta.lastSyncedAt || meta.updatedAt) || 0);
    }

    function hasPendingLocalChanges() {
      const syncedAt = getLastSyncedAt(state._meta);
      const localDirtyAt = Number(state._meta && state._meta.localDirtyAt || 0);
      return localDirtyAt > syncedAt;
    }

    function buildDataSnapshot(payload) {
      const source = payload && typeof payload === "object" ? payload : {};
      const snapshot = {};
      Object.entries(source).forEach(([key, value]) => {
        if (key === "_meta" || !Array.isArray(value)) return;
        snapshot[key] = value;
      });
      return JSON.stringify(snapshot);
    }

    function isUserEditingField() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = String(el.tagName || "").toLowerCase();
      if (!["input", "textarea", "select"].includes(tag)) return false;
      if (el.disabled || el.readOnly) return false;
      return true;
    }

    function renderAllSafely(reason = "") {
      if (safeRenderTimer) {
        clearTimeout(safeRenderTimer);
        safeRenderTimer = null;
      }
      if (!isUserEditingField()) {
        renderAll();
        return;
      }
      setSyncStatus(`偵測輸入中，稍後同步畫面${reason ? `（${reason}）` : ""}`);
      safeRenderTimer = setTimeout(() => {
        renderAllSafely(reason);
      }, 500);
    }

    function updateSyncMeta() {
      const now = Date.now();
      state._meta = {
        ...(state._meta || {}),
        localUpdatedAt: now,
        localDirtyAt: now,
        deviceId: getDeviceId()
      };
    }

    function buildCloudPayload() {
      const payload = { _meta: { ...(state._meta || {}) } };
      Object.entries(state).forEach(([key, value]) => {
        if (Array.isArray(value)) payload[key] = value;
      });
      return payload;
    }

    function getItemScore(item) {
      const candidates = [item && item.updatedAtIso, item && item.createdAtIso, item && item.updatedAt, item && item.createdAt];
      for (const value of candidates) {
        if (!value) continue;
        const ms = typeof value === "number" ? value : Date.parse(String(value));
        if (!Number.isNaN(ms)) return ms;
      }
      return 0;
    }

    function mergeArraysForCloud(localArr, remoteArr) {
      const local = Array.isArray(localArr) ? localArr : [];
      const remote = Array.isArray(remoteArr) ? remoteArr : [];
      if (!local.length) return remote;
      if (!remote.length) return local;

      const allObject = [...local, ...remote].every(x => x && typeof x === "object" && !Array.isArray(x));
      if (!allObject) {
        const seen = new Set();
        const merged = [];
        [...local, ...remote].forEach(item => {
          const key = JSON.stringify(item);
          if (seen.has(key)) return;
          seen.add(key);
          merged.push(item);
        });
        return merged;
      }

      const map = new Map();
      [...local, ...remote].forEach(item => {
        const mapKey = String(item.id || "");
        if (!mapKey) {
          map.set(`${JSON.stringify(item)}-${map.size}`, item);
          return;
        }
        const prev = map.get(mapKey);
        if (!prev || getItemScore(item) >= getItemScore(prev)) map.set(mapKey, item);
      });
      return Array.from(map.values());
    }

    function applyCloudPayload(remotePayload) {
      if (!remotePayload || typeof remotePayload !== "object") return false;
      const localUpdatedAt = getLastSyncedAt(state._meta);
      const localDirtyAt = Number(state._meta && state._meta.localDirtyAt || 0);
      const remoteUpdatedAt = Number(remotePayload._meta && remotePayload._meta.updatedAt || 0);
      if (!(remoteUpdatedAt > localUpdatedAt)) return false;

      // Do not overwrite local pending edits before they are pushed to cloud.
      if (localDirtyAt > localUpdatedAt) return false;

      const beforeData = buildDataSnapshot(state);
      Object.entries(remotePayload).forEach(([key, value]) => {
        if (key === "_meta") return;
        if (!Array.isArray(value)) return;
        state[key] = value;
      });
      state._meta = {
        ...(state._meta || {}),
        ...remotePayload._meta,
        lastSyncedAt: remoteUpdatedAt,
        updatedAt: remoteUpdatedAt,
        localDirtyAt: 0
      };
      const afterData = buildDataSnapshot(state);
      return beforeData !== afterData;
    }

    async function pullCloudState(options = {}) {
      const { silentRender = false } = options;
      try {
        setSyncStatus("同步中：讀取雲端...");
        const resp = await fetch(getCloudSyncUrl());
        if (!resp.ok) {
          setSyncStatus("雲端讀取失敗");
          return;
        }
        const data = await resp.json();
        if (!data || !data.ok) {
          setSyncStatus("雲端讀取失敗");
          return;
        }
        if (!data.value) {
          setSyncStatus(`已同步（${nowClock()}）`);
          return;
        }
        const changed = applyCloudPayload(data.value);
        if (!changed) {
          setSyncStatus(`已同步（${nowClock()}）`);
          return;
        }
        if (!silentRender) {
          isApplyingCloudState = true;
          renderAllSafely("雲端更新");
        }
        setSyncStatus(`已同步（${nowClock()}）`);
      } catch (err) {
        console.warn("雲端讀取失敗", err);
        setSyncStatus("雲端讀取失敗");
      } finally {
        isApplyingCloudState = false;
      }
    }

    async function pushCloudState() {
      if (cloudPushInFlight) return;
      cloudPushInFlight = true;
      try {
        setSyncStatus("同步中：寫入雲端...");
        const payload = buildCloudPayload();
        const baseVersion = Number(payload._meta && (payload._meta.lastSyncedAt || payload._meta.updatedAt) || 0);
        payload._meta = {
          ...(payload._meta || {}),
          baseUpdatedAt: baseVersion,
          lastSyncedAt: baseVersion,
          localUpdatedAt: Date.now(),
          deviceId: getDeviceId()
        };
        const resp = await fetch(getCloudSyncUrl(), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          if (resp.status === 409) {
            await pullCloudState();
            setSyncStatus("偵測版本衝突，已改用雲端最新資料");
            return;
          }
          throw new Error(`cloud write failed: ${resp.status}`);
        }
        const result = await resp.json();
        const serverVersion = Number(result && result.updatedAt || 0);
        if (serverVersion > 0) {
          isApplyingCloudState = true;
          state._meta = {
            ...(state._meta || {}),
            updatedAt: serverVersion,
            lastSyncedAt: serverVersion,
            localUpdatedAt: Date.now(),
            localDirtyAt: 0,
            deviceId: getDeviceId()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          isApplyingCloudState = false;
        }
        setSyncStatus(`已同步（${nowClock()}）`);
      } catch (err) {
        console.warn("雲端寫入失敗", err);
        setSyncStatus("雲端寫入失敗");
      } finally {
        cloudPushInFlight = false;
      }
    }

    function queueCloudPush() {
      if (!isCloudSyncConfigured()) return;
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(() => {
        pushCloudState();
      }, 900);
    }

    async function reconcileCloudState(triggerLabel = "自動") {
      if (cloudReconcileInFlight) return;
      cloudReconcileInFlight = true;
      try {
        setSyncStatus(`同步中：${triggerLabel}合併...`);
        if (hasPendingLocalChanges()) {
          await pushCloudState();
          await pullCloudState();
        } else {
          await pullCloudState();
          await pushCloudState();
        }
        setSyncStatus(`已同步（${nowClock()}）`);
      } catch (err) {
        console.warn("雲端合併同步失敗", err);
        setSyncStatus("雲端合併同步失敗");
      } finally {
        cloudReconcileInFlight = false;
      }
    }

    function wirePresenceSync() {
      window.addEventListener("focus", () => {
        reconcileCloudState("回到頁面");
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reconcileCloudState("頁面可見");
      });
      window.addEventListener("online", () => {
        reconcileCloudState("網路恢復");
      });
    }

    async function startCloudSync() {
      if (!isCloudSyncConfigured()) {
        setSyncStatus("雲端同步停用（未設定同步 API）");
        return;
      }
      await reconcileCloudState("啟動");
      cloudHydrationReady = true;
      clearInterval(cloudPullTimer);
      cloudPullTimer = setInterval(() => {
        if (hasPendingLocalChanges()) pushCloudState();
        else pullCloudState({ silentRender: true });
      }, 20000);
      try {
        await pullCloudState({ silentRender: true });
      } catch (err) {
        console.warn("啟動後自動同步失敗", err);
      }
    }

    async function manualCloudSync(buttonEl) {
      if (!isCloudSyncConfigured()) {
        alert("尚未設定同步 API，請先到系統設定填入雲端同步 API 位址");
        return;
      }
      const btn = buttonEl || document.getElementById("syncNowBtn");
      if (!btn || btn.disabled) return;
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "同步中...";
      setSyncStatus("同步中：手動同步...");
      try {
        if (hasPendingLocalChanges()) {
          await pushCloudState();
          await pullCloudState();
        } else {
          await pullCloudState();
          await pushCloudState();
        }
        cloudHydrationReady = true;
        setSyncStatus(`手動同步完成（${nowClock()}）`);
        alert("雲端同步完成");
      } catch (err) {
        console.warn("手動同步失敗", err);
        setSyncStatus("手動同步失敗");
        alert("雲端同步失敗，請稍後再試");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function saveState() {
      try {
        const before = localStorage.getItem(STORAGE_KEY);
        const baseline = JSON.stringify(state);
        if (before === baseline) return;

        const canMarkCloudMeta = !isApplyingCloudState && !isApplyingStorageState && (!isCloudSyncConfigured() || cloudHydrationReady);
        if (canMarkCloudMeta) updateSyncMeta();
        const serialized = JSON.stringify(state);
        if (before === serialized) return;

        localStorage.setItem(STORAGE_KEY, serialized);
        if (!isApplyingCloudState && !isApplyingStorageState && isCloudSyncConfigured() && cloudHydrationReady) queueCloudPush();
      } catch (err) {
        console.warn("無法儲存本機資料", err);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return false;
        Object.assign(state, parsed);
        state.role = normalizeRole(state.role);
        state.teachers = (Array.isArray(state.teachers) ? state.teachers : []).map(t => {
          if (!t) return null;
          if (typeof t === "string") {
            return { id: id(), name: t, className: state.classes[0] || "" };
          }
          const name = String(t.name || t.teacherName || "").trim();
          const className = String(t.className || t.teacherClass || "").trim();
          return { ...t, id: t.id || id(), name, className };
        }).filter(Boolean);
        return true;
      } catch (err) {
        console.warn("無法載入本機資料", err);
        return false;
      }
    }

    function wireStorageSync() {
      window.addEventListener("storage", e => {
        if (e.key !== STORAGE_KEY || !e.newValue) return;
        try {
          const localRole = state.role;
          const localOperator = state.currentOperator;
          const localActiveView = state.activeView;

          const parsed = JSON.parse(e.newValue);
          if (!parsed || typeof parsed !== "object") return;

          isApplyingStorageState = true;
          Object.assign(state, parsed);
          state.role = normalizeRole(localRole);
          state.currentOperator = localOperator;
          state.activeView = localActiveView;
          syncTeacherScopeByOperator();
          renderAllSafely("跨頁同步");
        } catch (err) {
          console.warn("跨頁同步失敗", err);
        } finally {
          isApplyingStorageState = false;
        }
      });
    }

    function log(action, detail) {
      state.logs.unshift({
        id: id(),
        time: new Date().toLocaleString("zh-TW"),
        role: normalizeRole(state.role),
        actor: getCurrentActor(),
        action,
        detail
      });
      renderLogs();
      saveState();
    }

    function normalizeRole(role) {
      if (role === "admin" || role === "管理員") return "admin";
      if (role === "supervisor" || role === "督導") return "supervisor";
      if (role === "teacher" || role === "教保員") return "teacher";
      return "admin";
    }

    function normalizeOperatorName(name) {
      return String(name || "").trim();
    }

    function getTeacherClassByName(name) {
      const target = String(name || "").trim();
      if (!target) return "";
      const teacher = state.teachers.find(t => String(t.name || "").trim() === target);
      return teacher ? String(teacher.className || "").trim() : "";
    }

    function syncTeacherScopeByOperator() {
      if (normalizeRole(state.role) !== "teacher") return;
      const teacherClass = getTeacherClassByName(state.currentOperator);
      if (!teacherClass) {
        state.selectedClass = "全部班級";
        state.selectedClient = "全部個案";
        return;
      }
      state.selectedClass = teacherClass;
      if (state.selectedClient !== "全部個案") {
        const selected = state.clients.find(c => c.name === state.selectedClient);
        if (!selected || selected.className !== teacherClass) {
          state.selectedClient = "全部個案";
        }
      }
    }

    function getRoleOperators(role) {
      const normalizedRole = normalizeRole(role);
      if (normalizedRole === "teacher") {
        const names = Array.from(new Set(
          state.teachers
            .map(t => normalizeOperatorName(t && t.name))
            .filter(Boolean)
        ));
        return names.length ? names : ["教保員"];
      }
      if (normalizedRole === "supervisor") return ["督導"];
      return ["管理員"];
    }

    function syncOperatorByRole() {
      const select = document.getElementById("operatorSelect");
      if (!select) return;
      state.role = normalizeRole(state.role);
      const options = getRoleOperators(state.role);
      const current = normalizeOperatorName(state.currentOperator);
      const matched = options.find(name => normalizeOperatorName(name) === current);
      state.currentOperator = matched || options[0];

      const optionsHtml = options.map(name => `<option>${name}</option>`).join("");
      if (select.dataset.optionsHtml !== optionsHtml) {
        select.innerHTML = optionsHtml;
        select.dataset.optionsHtml = optionsHtml;
      }
      if (select.value !== state.currentOperator) {
        isProgrammaticOperatorUpdate = true;
        select.value = state.currentOperator;
        queueMicrotask(() => {
          isProgrammaticOperatorUpdate = false;
        });
      }
      syncTeacherScopeByOperator();
    }

    function syncToolbarSelectors() {
      const roleSelect = document.getElementById("roleSelect");
      state.role = normalizeRole(state.role);
      if (roleSelect && roleSelect.value !== state.role) {
        roleSelect.value = state.role;
      }
      syncOperatorByRole();
    }

    function canManageOwner(ownerName) {
      const role = normalizeRole(state.role);
      if (role === "admin" || role === "supervisor") return true;
      if (!ownerName) return true;
      return ownerName === getCurrentActor();
    }

    function assertOwnerBeforeDelete(entity, label) {
      const owner = entity && (entity.createdBy || entity.created_by);
      if (canManageOwner(owner)) return true;
      alert(`無法刪除${label}：此資料建立者為 ${owner}`);
      log("拒絕刪除", `${label} 建立者:${owner}`);
      return false;
    }

    function can(permission) {
      const role = normalizeRole(state.role);
      const map = {
        admin: ["all"],
        supervisor: ["view_all", "view_chart", "view_report"],
        teacher: ["record", "edit_own_class", "view_own_chart", "export"]
      };
      if (role === "admin") return true;
      return map[role].includes(permission);
    }

    function init() {
      try {
        ensureRuntimeFallbacks();
        renderSyncKeyBadge();
        updateCloudSyncBadge();
        const hasSavedState = loadState();
        if (!hasSavedState) ensureDemoRecords();
        else if (!state.logs) state.logs = [];
        wireStorageSync();
        wirePresenceSync();
        renderNav();
        wireToolbar();
        fillFilters();
        renderAll();
        updateCloudSyncBadge();
        startCloudSync();
        log("系統啟動", "Smart Care 管理平台已載入");
      } catch (err) {
        document.body.innerHTML = `<div style="padding:24px;font-family:sans-serif;"><h2>Smart Care 載入失敗</h2><p>${String(err && err.message ? err.message : err)}</p><p>請重新整理，或開啟 TUNNEL_FIX.md 依指引排除。</p></div>`;
        console.error(err);
      }
    }

        if (!state.clients.some(c => c.name === name)) {
          state.clients.push({
            id: id(),
            name,
            birthday: "2012-01-01",
            className: state.classes[Math.min(idx, state.classes.length - 1)],

      const qualities = ["良好", "普通", "不佳"];
      const taskNames = ["擦桌子", "倒垃圾", "洗手", "刷牙", "放水杯"];

      for (let i = 0; i < 180; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const date = d.toISOString().slice(0, 10);
        state.clients.slice(0, 5).forEach((client, cIdx) => {
          taskNames.forEach((task, tIdx) => {
            if ((i + cIdx + tIdx) % 3 !== 0) return;
            const quality = qualities[(i + cIdx + tIdx) % qualities.length];
            const award = 1 + ((i + tIdx) % 4);
            const deduct = quality === "不佳" ? ((i + cIdx) % 2) : 0;
            state.records.push({
              id: id(),
              date,
              clientName: client.name,
              className: client.className,
              taskName: task,
              completed: (i + cIdx + tIdx) % 5 !== 0,
              prompt: promptsPool[(i + cIdx + tIdx) % promptsPool.length],
              quality,
              tokenAward: award,
              tokenDeduct: deduct,
              behaviorEvent: quality === "不佳" ? "注意力分散" : "",
              handling: quality === "不佳" ? "口頭提醒" : "",
              result: quality === "不佳" ? "可回到工作" : "",

          {

            date: today(),
            clientName: "王小華",
            emotion: "😀 愉快",

            durationMinutes: 30,

      }

      if (!state.behaviorEvents.length) {
        state.behaviorEvents.push({

          antecedent: "等待",

    function renderNav() {
      const nav = document.getElementById("nav");
      const pendingTokenUndoCount = (state.tokenUndoRequests || []).filter(r => r.status === "pending").length;
      nav.innerHTML = viewMap.map(v => (
        `<button data-view="${v.key}" class="${state.activeView === v.key ? "active" : ""}">
          <span class="nav-label">${v.label}</span>
          ${v.key === "tokens" && pendingTokenUndoCount > 0 ? `<span class="nav-badge" title="待審撤銷申請">${pendingTokenUndoCount}</span>` : ""}
        </button>`
      )).join("");
      nav.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeView = btn.dataset.view;
          switchView();
        });
      });
    }

    function switchView() {
      document.querySelectorAll(".view").forEach(el => {
        el.classList.toggle("active", el.id === `view-${state.activeView}`);
      });
      renderNav();
      renderAll();
    }

    function wireToolbar() {
      document.getElementById("roleSelect").addEventListener("change", e => {
        state.role = normalizeRole(e.target.value);
        syncOperatorByRole();
        const roleSelect = document.getElementById("roleSelect");
        if (roleSelect) roleSelect.value = state.role;
        log("角色切換", `切換為 ${state.role}`);
        renderAll();
      });
      document.getElementById("operatorSelect").addEventListener("change", e => {
        if (isProgrammaticOperatorUpdate) return;
        state.currentOperator = e.target.value;
        syncTeacherScopeByOperator();
        log("操作者切換", `切換為 ${state.currentOperator}`);
        renderAll();
      });
      document.getElementById("classFilter").addEventListener("change", e => {
        state.selectedClass = e.target.value;
        refillClientFilter();
        renderAll();
      });
      document.getElementById("clientFilter").addEventListener("change", e => {
        state.selectedClient = e.target.value;
        renderAll();
      });
      document.getElementById("backupBtn").addEventListener("click", backupData);
      document.getElementById("openLogBtn").addEventListener("click", () => {
        state.activeView = "logs";
        switchView();
      });
      document.getElementById("syncNowBtn").addEventListener("click", e => {
        manualCloudSync(e.currentTarget);
      });
      if (!isCloudSyncConfigured()) {
        const syncBtn = document.getElementById("syncNowBtn");
        if (syncBtn) {
          syncBtn.disabled = true;
          syncBtn.title = "尚未設定同步 API：目前僅本機儲存";
        }
      }
    }

    function fillFilters() {
      const classFilter = document.getElementById("classFilter");
      const role = normalizeRole(state.role);
      if (role === "teacher") {
        const teacherClass = getTeacherClassByName(state.currentOperator);
        if (teacherClass) {
          state.selectedClass = teacherClass;
          classFilter.innerHTML = [`<option>${teacherClass}</option>`].join("");
          classFilter.value = teacherClass;
        } else {
          state.selectedClass = "全部班級";
          classFilter.innerHTML = ["全部班級"].map(c => `<option>${c}</option>`).join("");
          classFilter.value = state.selectedClass;
        }
      } else {
        classFilter.innerHTML = ["全部班級", ...state.classes].map(c => `<option>${c}</option>`).join("");
        if (!["全部班級", ...state.classes].includes(state.selectedClass)) {
          state.selectedClass = "全部班級";
        }
        classFilter.value = state.selectedClass;
      }
      refillClientFilter();
    }

    function refillClientFilter() {
      const options = state.clients
        .filter(c => state.selectedClass === "全部班級" || c.className === state.selectedClass)
        .map(c => c.name);
      const clientFilter = document.getElementById("clientFilter");
      clientFilter.innerHTML = ["全部個案", ...options].map(c => `<option>${c}</option>`).join("");
      if (!options.includes(state.selectedClient)) state.selectedClient = "全部個案";
      clientFilter.value = state.selectedClient;
    }

    function getFilteredRecords() {
      return state.records.filter(r => {
        const classOk = state.selectedClass === "全部班級" || r.className === state.selectedClass;
        const clientOk = state.selectedClient === "全部個案" || r.clientName === state.selectedClient;
        return classOk && clientOk;
      });
    }

    function renderActiveView() {
      switch (state.activeView) {
        case "dashboard":
          renderDashboard();
          break;
        case "cases":
          renderCases();
          break;
        case "records":
          renderRecords();
          break;
        case "tokens":
          renderTokens();
          break;
        case "emotion":
          renderEmotion();
          break;
        case "media":
          renderMediaHub();
          break;
        case "isp":
          renderIsp();
          break;
        case "analysis":
          renderAnalysis();
          break;
        case "reports":
          renderReports();
          break;
        case "settings":
          renderSettings();
          break;
        case "logs":
          renderLogs();
          break;
        case "mobile":
          renderMobile();
          break;
        default:
          renderDashboard();
          break;
      }
    }

      syncToolbarSelectors();
      renderActiveView();
      fillFilters();
      saveState();
    }

              <button class="btn" onclick="state.activeView='isp';switchView();">新增 ISP 目標</button>

    function renderCases() {
      const host = document.getElementById("view-cases");
      host.innerHTML = `
        <div class="card">
          <h3>新增 / 編輯個案</h3>
          <form id="caseForm" class="grid-4">
            <div class="field"><label>姓名</label><input name="name" required /></div>
            <div class="field"><label>生日</label><input type="date" name="birthday" required /></div>
            <div class="field"><label>班級</label><select name="className">${state.classes.map(c => `<option>${c}</option>`).join("")}</select></div>
            <div class="field"><label>障礙程度</label><select name="disability"><option>輕度</option><option>中度</option><option>重度</option><option>極重度</option><option>多重障礙</option></select></div>
            <div class="field"><label>能力等級</label><input name="ability" placeholder="A/B/C" /></div>

            <div class="actions" style="grid-column: 1 / -1;">
              <button class="btn primary" type="submit">儲存</button>

            <button class="btn danger" type="button" id="caseBulkDeleteBtn">刪除勾選</button>
          </div>

            <thead><tr><th><input type="checkbox" id="caseSelectAll" aria-label="全選個案"></th><th>姓名</th><th>班級</th><th>能力</th><th>目標</th><th>建立者</th><th>操作</th></tr></thead>
            <tbody id="caseTableBody"></tbody>
          </table>
        </div>
      `;

      const tbody = host.querySelector("#caseTableBody");
      tbody.innerHTML = state.clients.map(c => `
        <tr>
          <td><input type="checkbox" data-case-select="${c.id}" aria-label="勾選個案 ${c.name}"></td>
          <td>${c.name}</td>
          <td>${c.className}</td>
          <td>${c.ability}</td>
          <td>${c.goal}</td>
          <td>${c.createdBy || "-"}</td>
          <td>
            <div class="actions">
              <button class="btn" data-case-manage="${c.id}">管理</button>
              <button class="btn good" data-case-view="${c.id}">查看</button>
              <button class="btn warn" data-case-preview="${c.id}">預覽</button>
            </div>
          </td>
        </tr>
      `).join("");

      const caseSelectAll = host.querySelector("#caseSelectAll");
      const caseSelectAllBtn = host.querySelector("#caseSelectAllBtn");
      const caseBulkDeleteBtn = host.querySelector("#caseBulkDeleteBtn");

      function getSelectedCaseIds() {
        return Array.from(tbody.querySelectorAll("[data-case-select]:checked")).map(cb => cb.dataset.caseSelect);
      }

      function setAllCaseSelection(checked) {
        tbody.querySelectorAll("[data-case-select]").forEach(cb => {
          cb.checked = checked;
        });
        if (caseSelectAll) caseSelectAll.checked = checked;
      }

      function syncCaseSelectAllState() {
        const list = Array.from(tbody.querySelectorAll("[data-case-select]"));
        if (!caseSelectAll) return;
        caseSelectAll.checked = list.length > 0 && list.every(cb => cb.checked);
      }

      if (caseSelectAll) {
        caseSelectAll.addEventListener("change", e => {
          setAllCaseSelection(e.target.checked);
        });
      }

      if (caseSelectAllBtn) {
        caseSelectAllBtn.addEventListener("click", () => {
          const list = Array.from(tbody.querySelectorAll("[data-case-select]"));
          const shouldSelectAll = list.some(cb => !cb.checked);
          setAllCaseSelection(shouldSelectAll);
        });
      }

      tbody.addEventListener("change", e => {
        const checkbox = e.target.closest("[data-case-select]");
        if (!checkbox) return;
        syncCaseSelectAllState();
      });

      if (caseBulkDeleteBtn) {
        caseBulkDeleteBtn.addEventListener("click", () => {
          const selectedIds = getSelectedCaseIds();
          if (!selectedIds.length) return alert("請先勾選至少一位個案");
          const confirmed = confirm(`確定刪除已勾選 ${selectedIds.length} 位個案嗎？`);
          if (!confirmed) return;

          const selectedSet = new Set(selectedIds);
          const removedNames = [];
          let denied = 0;
          state.clients = state.clients.filter(client => {
            if (!selectedSet.has(client.id)) return true;
            if (!assertOwnerBeforeDelete(client, "個案")) {
              denied += 1;
              return true;
            }
            removedNames.push(client.name);
            return false;
          });

          if (!removedNames.length) return alert("沒有可刪除的勾選個案");
          if (state.selectedCaseId && selectedSet.has(state.selectedCaseId)) state.selectedCaseId = null;
          if (removedNames.includes(state.selectedClient)) state.selectedClient = "全部個案";
          log("批次刪除個案", `成功 ${removedNames.length} 位${denied ? `，權限不足 ${denied} 位` : ""}`);
          renderAll();
        });
      }

      const form = host.querySelector("#caseForm");
      form.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(form);
        const entry = {
          id: id(),
          name: fd.get("name"),
          birthday: fd.get("birthday"),
          className: fd.get("className"),
          disability: fd.get("disability"),
          ability: fd.get("ability"),
          goal: fd.get("goal"),
          notes: fd.get("notes"),
          createdBy: getCurrentActor(),
          reinforcers: String(fd.get("reinforcers") || "").split(",").map(s => s.trim()).filter(Boolean)
        };
        state.clients.push(entry);
        state.selectedClient = entry.name;
        log("新增個案", `${entry.name} / ${entry.className}`);
        renderCases();
        refillClientFilter();
      });

      host.querySelector("#caseUpdateBtn").addEventListener("click", () => {
        if (!state.selectedCaseId) return alert("請先按管理載入一位個案");
        const fd = new FormData(form);
        const c = state.clients.find(x => x.id === state.selectedCaseId);
        if (!c) return;
        c.name = fd.get("name");
        c.birthday = fd.get("birthday");
        c.className = fd.get("className");
        c.disability = fd.get("disability");
        c.ability = fd.get("ability");
        c.goal = fd.get("goal");
        c.notes = fd.get("notes");
        c.reinforcers = String(fd.get("reinforcers") || "").split(",").map(s => s.trim()).filter(Boolean);
        log("更新個案", `${c.name}`);
        renderAll();
      });

      host.querySelector("#caseDeleteBtn").addEventListener("click", () => {
        if (!state.selectedCaseId) return alert("請先按管理載入一位個案");
        const idx = state.clients.findIndex(x => x.id === state.selectedCaseId);
        if (idx < 0) return;
        if (!assertOwnerBeforeDelete(state.clients[idx], "個案")) return;
        const removed = state.clients.splice(idx, 1)[0];
        state.selectedCaseId = null;
        log("刪除個案", removed.name);
        renderAll();
      });

      host.querySelector("#caseClearBtn").addEventListener("click", () => {
        form.reset();
        state.selectedCaseId = null;
      });

      tbody.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        if (btn.dataset.caseManage) {
          const c = state.clients.find(x => x.id === btn.dataset.caseManage);
          if (!c) return;
          state.selectedCaseId = c.id;
          form.elements["name"].value = c.name;
          form.elements["birthday"].value = c.birthday;
          form.elements["className"].value = c.className;
          form.elements["disability"].value = c.disability;
          form.elements["ability"].value = c.ability;
          form.elements["goal"].value = c.goal;
          form.elements["reinforcers"].value = c.reinforcers.join(",");
          form.elements["notes"].value = c.notes;
          log("管理個案", c.name);
          alert(`已載入 ${c.name}，可直接更新或刪除`);
        }
        if (btn.dataset.caseView) {
          const c = state.clients.find(x => x.id === btn.dataset.caseView);
          if (!c) return;
          state.selectedClass = c.className;
          state.selectedClient = c.name;
          fillFilters();
          log("查看個案", c.name);
          alert(`${c.name}\n班級：${c.className}\n主要目標：${c.goal}`);
        }
        if (btn.dataset.casePreview) {

      function getSelectedRecordIds() {
        return Array.from(table.querySelectorAll("[data-record-select]:checked")).map(cb => cb.dataset.recordSelect);

      function exportRows(rowsToExport) {
        if (!rowsToExport.length) {
          alert("沒有可匯出的紀錄");
          return;
        }
        const mapped = rowsToExport.map(r => ({
          日期: r.date,
          班級: r.className,
          個案: r.clientName,
          工作: r.taskName,
          提示: r.prompt,
          是否完成: r.completed ? "是" : "否",
          品質: r.quality,
          代幣給予: r.tokenAward,
          品質回扣: r.tokenDeduct,
          行為事件: r.behaviorEvent || "",
          處理方式: r.handling || "",
          結果: r.result || "",
          建立者: r.createdBy || ""

        if (window.XLSX && window.XLSX.utils) {
          const wb = XLSX.utils.book_new();
          const ws = XLSX.utils.json_to_sheet(mapped);

          const header = Object.keys(mapped[0]);
          const csv = [
            header.join(","),
            ...mapped.map(row => header.map(h => `"${String(row[h] || "").replace(/"/g, '""')}"`).join(","))
          ].join("\n");
          const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `smart-care-records-selected-${today()}.csv`;
          a.click();
          URL.revokeObjectURL(a.href);

      if (recordResetFilterBtn) {

          const selectedSet = new Set(selectedIds);
          const selectedRows = rows.filter(r => selectedSet.has(r.id));
          exportRows(selectedRows);
        });

      function setAllRecordSelection(checked) {
        table.querySelectorAll("[data-record-select]").forEach(cb => {
          cb.checked = checked;
        });
        if (recordSelectAll) recordSelectAll.checked = checked;
      }

      function syncRecordSelectAllState() {
        const list = Array.from(table.querySelectorAll("[data-record-select]"));
        if (!recordSelectAll) return;
        recordSelectAll.checked = list.length > 0 && list.every(cb => cb.checked);
      }

      if (recordSelectAll) {
        recordSelectAll.addEventListener("change", e => {
          setAllRecordSelection(e.target.checked);
        });
      }

      if (recordSelectAllBtn) {
        recordSelectAllBtn.addEventListener("click", () => {
          const list = Array.from(table.querySelectorAll("[data-record-select]"));
          const shouldSelectAll = list.some(cb => !cb.checked);
          setAllRecordSelection(shouldSelectAll);
        });
      }

      table.addEventListener("change", e => {
        const checkbox = e.target.closest("[data-record-select]");
        if (!checkbox) return;
        syncRecordSelectAllState();
      });

      if (recordBulkDeleteBtn) {
        recordBulkDeleteBtn.addEventListener("click", () => {
          const selectedIds = getSelectedRecordIds();
          if (!selectedIds.length) return alert("請先勾選至少一筆每日紀錄");
          const confirmed = confirm(`確定刪除已勾選 ${selectedIds.length} 筆每日紀錄嗎？`);
          if (!confirmed) return;

          const selectedSet = new Set(selectedIds);
          const removedList = [];
          let denied = 0;
          state.records = state.records.filter(rec => {
            if (!selectedSet.has(rec.id)) return true;
            if (!assertOwnerBeforeDelete(rec, "每日紀錄")) {
              denied += 1;
              return true;
            }
            removedList.push(rec);
            return false;
          });

          if (!removedList.length) return alert("沒有可刪除的勾選每日紀錄");
          if (state.selectedRecordForEdit && selectedSet.has(state.selectedRecordForEdit)) {
            state.selectedRecordForEdit = null;
          }
          log("批次刪除每日紀錄", `成功 ${removedList.length} 筆${denied ? `，權限不足 ${denied} 筆` : ""}`);
          renderAll();
        });

      const form = host.querySelector("#recordForm");
      form.addEventListener("submit", e => {
        e.preventDefault();
        if (!can("record") && !can("all")) return alert("目前角色無新增每日紀錄權限");
        const fd = new FormData(form);
        const client = state.clients.find(c => c.name === fd.get("clientName"));
        const rec = {
          id: id(),
          date: fd.get("date"),
          clientName: fd.get("clientName"),
          className: client ? client.className : "未知班級",
          taskName: fd.get("taskName"),
          prompt: fd.get("prompt"),
          completed: fd.get("completed") === "true",
          quality: fd.get("quality"),
          tokenAward: Number(fd.get("tokenAward") || 0),
          tokenDeduct: Number(fd.get("tokenDeduct") || 0),
          behaviorEvent: fd.get("behaviorEvent"),
          handling: fd.get("handling"),
          result: fd.get("result"),
          createdBy: getCurrentActor()
        };
        state.records.push(rec);
        log("新增每日紀錄", `${rec.clientName}/${rec.taskName}/+${rec.tokenAward}/-${rec.tokenDeduct}`);
        renderAll();

        const client = state.clients.find(c => c.name === fd.get("clientName"));
        rec.date = fd.get("date");
        rec.clientName = fd.get("clientName");
        rec.className = client ? client.className : rec.className;
        rec.taskName = fd.get("taskName");
        rec.prompt = fd.get("prompt");
        rec.completed = fd.get("completed") === "true";
        rec.quality = fd.get("quality");
        rec.tokenAward = Number(fd.get("tokenAward") || 0);
        rec.tokenDeduct = Number(fd.get("tokenDeduct") || 0);
        rec.behaviorEvent = fd.get("behaviorEvent");
        rec.handling = fd.get("handling");
        rec.result = fd.get("result");
        log("更新每日紀錄", `${rec.clientName}/${rec.taskName}`);
        renderAll();
      });

      host.querySelector("#recordDeleteBtn").addEventListener("click", () => {
        if (!state.selectedRecordForEdit) return alert("請先按管理載入一筆紀錄");
        const idx = state.records.findIndex(x => x.id === state.selectedRecordForEdit);
        if (idx < 0) return;
        if (!assertOwnerBeforeDelete(state.records[idx], "每日紀錄")) return;
        const removed = state.records.splice(idx, 1)[0];
        state.selectedRecordForEdit = null;
        log("刪除每日紀錄", `${removed.clientName}/${removed.taskName}`);

      table.addEventListener("click", e => {

          form.elements["clientName"].value = rec.clientName;

          form.elements["tokenAward"].value = rec.tokenAward;
          form.elements["tokenDeduct"].value = rec.tokenDeduct;

          switchView();
        }
      });

      });

        reward.cost = Number(fd.get("cost"));

    function exportTokenExchangesExcel() {
      const requestById = {};
      (state.tokenUndoRequests || []).forEach(req => {

      });
      const rows = getFilteredTokenExchanges().map(x => ({
        時間: x.dateTime,

        項目: x.rewardItem,
        扣點: x.cost,
        內容: x.content,
        操作人: x.createdBy,
        是否撤銷: x.isVoided ? "是" : "否",
        撤銷時間: x.voidedAt || "",
        撤銷原因: x.voidReason || "",
        撤銷人: x.voidedBy || "",
        申請人: (requestById[x.undoRequestId] && requestById[x.undoRequestId].requestedBy) || "",
        審核狀態: (requestById[x.undoRequestId] && requestById[x.undoRequestId].status) || "",
        審核人: (requestById[x.undoRequestId] && requestById[x.undoRequestId].reviewedBy) || "",
        審核時間: (requestById[x.undoRequestId] && requestById[x.undoRequestId].reviewedAt) || "",
        審核備註: (requestById[x.undoRequestId] && requestById[x.undoRequestId].reviewComment) || ""
      }));

      if (window.XLSX) {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 時間: "", 個案: "", 項目: "", 扣點: "", 內容: "", 操作人: "", 是否撤銷: "", 撤銷時間: "", 撤銷原因: "", 撤銷人: "", 申請人: "", 審核狀態: "", 審核人: "", 審核時間: "", 審核備註: "" }]);
        XLSX.utils.book_append_sheet(wb, ws, "兌換紀錄");
        XLSX.writeFile(wb, `smart-care-token-exchanges-${today()}.xlsx`);
      } else {
        const header = ["時間", "個案", "項目", "扣點", "內容", "操作人", "是否撤銷", "撤銷時間", "撤銷原因", "撤銷人", "申請人", "審核狀態", "審核人", "審核時間", "審核備註"];
        const csv = [
          header.join(","),
          ...rows.map(r => header.map(h => `"${String(r[h] || "").replace(/"/g, '""')}"`).join(","))
        ].join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `smart-care-token-exchanges-${today()}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      log("匯出 Excel", "已匯出兌換紀錄（含申請與審核欄位）");
    }

    function getFilteredTokenExchanges() {
      const f = state.tokenExchangeFilter || { period: "本月", clientName: "全部個案", startDate: "", endDate: "" };
      const now = new Date();
      const currentQuarter = Math.floor((now.getMonth() + 3) / 3);

      return state.tokenExchanges.filter(x => {
        const clientOk = f.clientName === "全部個案" || x.clientName === f.clientName;
        if (!clientOk) return false;
        const iso = String(x.createdAtIso || "");
        if (!iso) return true;
        const d = new Date(iso);
        if (f.period === "全部") return true;
        if (f.period === "本月") {
          return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        }
        if (f.period === "本季") {
          const q = Math.floor((d.getMonth() + 3) / 3);
          return d.getFullYear() === now.getFullYear() && q === currentQuarter;
        }
        if (f.period === "自訂") {
          if (!f.startDate || !f.endDate) return true;
          const day = iso.slice(0, 10);
          return day >= f.startDate && day <= f.endDate;
        }
        return true;
      });
    }

    function isExchangeUndoAllowed(exchange) {
      if (!exchange || !exchange.createdAtIso) return false;
      const ms = Date.now() - new Date(exchange.createdAtIso).getTime();
      return ms <= state.undoWindowMinutes * 60 * 1000;
    }

    function getCurrentTeacherClass() {
      if (normalizeRole(state.role) !== "teacher") return "";
      const me = state.teachers.find(t => t.name === getCurrentActor());
      return me ? me.className : "";
    }

    function canAccessClientByRole(clientName) {
      if (state.role !== "teacher") return true;
      const c = state.clients.find(x => x.name === clientName);
      if (!c) return false;
      const className = getCurrentTeacherClass();
      return !!className && c.className === className;
    }

    function canEditCareRecordByRole(row) {
      if (!row) return false;
      if (state.role === "teacher") {
        return canAccessClientByRole(row.clientName);
      }
      return canManageOwner(row.createdBy);
    }

    function getPermittedClientNames() {
      if (state.role !== "teacher") return state.clients.map(c => c.name);
      const className = getCurrentTeacherClass();
      return state.clients.filter(c => c.className === className).map(c => c.name);
    }

      const filteredServices = state.serviceRecords.filter(r => {

      function exportCareRows(rows, fileBase, sheetName) {
        if (!rows.length) return alert("沒有可匯出的勾選資料");
        if (window.XLSX && window.XLSX.utils) {
          const wb = XLSX.utils.book_new();
          const ws = XLSX.utils.json_to_sheet(rows);
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
          XLSX.writeFile(wb, `${fileBase}-${today()}.xlsx`);
        } else {
          const header = Object.keys(rows[0]);
          const csv = [
            header.join(","),
            ...rows.map(row => header.map(h => `"${String(row[h] || "").replace(/"/g, '""')}"`).join(","))
          ].join("\n");
          const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `${fileBase}-${today()}.csv`;
          a.click();
          URL.revokeObjectURL(a.href);
        }
      }

      function setSelection(tableEl, selector, checked, selectAllEl) {
        tableEl.querySelectorAll(selector).forEach(cb => {
          cb.checked = checked;
        });
        if (selectAllEl) selectAllEl.checked = checked;
      }

      function syncSelectionState(tableEl, selector, selectAllEl) {
        if (!selectAllEl) return;
        const list = Array.from(tableEl.querySelectorAll(selector));
        selectAllEl.checked = list.length > 0 && list.every(cb => cb.checked);
      }

      if (abcSelectAll) {
        abcSelectAll.addEventListener("change", e => {
          setSelection(abcTable, "[data-abc-select]", e.target.checked, abcSelectAll);
        });

        abcSelectAllBtn.addEventListener("click", () => {
          const list = Array.from(abcTable.querySelectorAll("[data-abc-select]"));

          setSelection(abcTable, "[data-abc-select]", shouldSelectAll, abcSelectAll);
        });
      }
      abcTable.addEventListener("change", e => {
        const cb = e.target.closest("[data-abc-select]");

          const removed = [];
          let denied = 0;
          state.behaviorEvents = state.behaviorEvents.filter(row => {
            if (!selectedSet.has(row.id)) return true;
            if (!assertOwnerBeforeDelete(row, "ABC 事件")) {
              denied += 1;
              return true;
            }
            removed.push(row);
            return false;
          });
          if (!removed.length) return alert("沒有可刪除的勾選 ABC 事件");
          if (state.selectedBehaviorForEdit && selectedSet.has(state.selectedBehaviorForEdit)) state.selectedBehaviorForEdit = null;
          log("批次刪除 ABC 事件", `成功 ${removed.length} 筆${denied ? `，權限不足 ${denied} 筆` : ""}`);
          renderAll();
        });

              個案: r.clientName,

          state.serviceRecords = state.serviceRecords.filter(row => {
            if (!selectedSet.has(row.id)) return true;
            if (!assertOwnerBeforeDelete(row, "服務紀錄")) {
              denied += 1;
              return true;
            }
            removed.push(row);
            return false;
          });

    function renderIsp() {
      const host = document.getElementById("view-isp");
      const permittedClients = getPermittedClientNames();
      const clientOptions = permittedClients.map(name => `<option>${name}</option>`).join("");
      const byClient = state.selectedClient === "全部個案" ? state.isps : state.isps.filter(i => i.clientName === state.selectedClient);
      const ispListFilterMode = state.ispListFilterMode || "全部";
      const ispScopePackages = state.clients
        .filter(c => state.selectedClient === "全部個案" || c.name === state.selectedClient)
        .map(c => {
          const entries = byClient.filter(i => i.clientName === c.name);
          const latestEntry = entries
            .slice()
            .sort((a, b) => {
              const ta = new Date(a.updatedAtIso || a.createdAtIso || 0).getTime();
              const tb = new Date(b.updatedAtIso || b.createdAtIso || 0).getTime();
              return tb - ta;
            })[0] || null;
          const long = entries.find(i => i.type === "長期目標") || null;
          const shorts = entries
            .filter(i => i.type === "短期目標")
            .sort((a, b) => Number(a.shortOrder || 99) - Number(b.shortOrder || 99));
          const shortValidCount = shorts.filter(s => String(s.goal || "").trim() && String(s.passCriteria || "").trim()).length;
          const hasLong = !!(long && String(long.goal || "").trim() && String(long.passCriteria || "").trim());
          const isComplete = hasLong && shortValidCount >= 3;
          return {
            clientName: c.name,
            long,
            shorts,
            entries,
            shortCount: shorts.length,
            shortValidCount,
            hasLong,
            isComplete,
            ownerText: [...new Set(entries.map(x => x.createdBy || "-") )].join("/") || "-",
            lastUpdatedBy: latestEntry ? (latestEntry.updatedBy || latestEntry.createdBy || "-") : "-",
            lastUpdatedAtMs: latestEntry && (latestEntry.updatedAtIso || latestEntry.createdAtIso)
              ? new Date(latestEntry.updatedAtIso || latestEntry.createdAtIso).getTime()
              : 0,
            lastUpdatedAtText: latestEntry && (latestEntry.updatedAtIso || latestEntry.createdAtIso)
              ? new Date(latestEntry.updatedAtIso || latestEntry.createdAtIso).toLocaleString("zh-TW")
              : "-"
          };
        });

      const ispTotalCount = ispScopePackages.length;
      const ispCompleteCount = ispScopePackages.filter(pkg => pkg.isComplete).length;
      const ispMissingCount = Math.max(0, ispTotalCount - ispCompleteCount);
      const ispCompletionPct = ispTotalCount ? Math.round((ispCompleteCount / ispTotalCount) * 100) : 0;
      const ispSortMode = state.ispSortMode || "最新更新";
      const ispRecentFilter = state.ispRecentFilter || "全部";
      const ispRecentStartDate = String(state.ispRecentStartDate || "");
      const ispRecentEndDate = String(state.ispRecentEndDate || "");
      const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
      const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
      const nowMs = Date.now();

      const ispPackages = ispScopePackages
        .filter(pkg => {
          if (ispListFilterMode === "全部") return true;
          return !pkg.isComplete;
        })
        .filter(pkg => {
          if (ispRecentFilter === "全部") return true;
          if (!pkg.lastUpdatedAtMs) return false;
          if (ispRecentFilter === "7天內") {
            return (nowMs - pkg.lastUpdatedAtMs) <= sevenDaysMs;
          }
          if (ispRecentFilter === "30天內") {
            return (nowMs - pkg.lastUpdatedAtMs) <= thirtyDaysMs;
          }
          if (ispRecentFilter === "自訂區間") {
            const startMs = ispRecentStartDate ? new Date(`${ispRecentStartDate}T00:00:00`).getTime() : null;
            const endMs = ispRecentEndDate ? new Date(`${ispRecentEndDate}T23:59:59.999`).getTime() : null;
            if (!startMs && !endMs) return true;
            if (startMs && pkg.lastUpdatedAtMs < startMs) return false;
            if (endMs && pkg.lastUpdatedAtMs > endMs) return false;
            return true;
          }
          return true;
        })
        .sort((a, b) => {
          if (ispSortMode === "最新更新") {
            if (a.lastUpdatedAtMs !== b.lastUpdatedAtMs) return b.lastUpdatedAtMs - a.lastUpdatedAtMs;
            return a.clientName.localeCompare(b.clientName, "zh-Hant");
          }
          if (ispSortMode === "個案名稱") {
            return a.clientName.localeCompare(b.clientName, "zh-Hant");
          }
          if (ispSortMode === "缺漏優先") {
            if (a.isComplete !== b.isComplete) return a.isComplete ? 1 : -1;
            return a.clientName.localeCompare(b.clientName, "zh-Hant");
          }
          if (a.isComplete !== b.isComplete) return a.isComplete ? 1 : -1;
          return a.clientName.localeCompare(b.clientName, "zh-Hant");
        });

      const recentSummaryText = ispRecentFilter === "自訂區間"
        ? `自訂區間（${ispRecentStartDate || "未設定"} ~ ${ispRecentEndDate || "未設定"}）`
        : ispRecentFilter;
      const filterSummaryText = `篩選：${ispListFilterMode}｜排序：${ispSortMode}｜更新期間：${recentSummaryText}｜目前筆數：${ispPackages.length}`;
      const lastExportText = state.ispLastExportAt
        ? `最近匯出：${state.ispLastExportAt} / ${state.ispLastExportBy || "-"}`
        : "最近匯出：尚無紀錄";

      host.innerHTML = `

            <div class="field" style="grid-column: 1 / -1;"><label>長期目標通過標準</label><input name="longPassCriteria" required /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>短期目標 1</label><input name="shortGoal1" required /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>短期目標 1 通過標準</label><input name="shortPassCriteria1" required /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>短期目標 2</label><input name="shortGoal2" required /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>短期目標 2 通過標準</label><input name="shortPassCriteria2" required /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>短期目標 3</label><input name="shortGoal3" required /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>短期目標 3 通過標準</label><input name="shortPassCriteria3" required /></div>
            <div class="actions" style="grid-column: 1 / -1;">
              <button class="btn primary" type="submit">儲存個案 ISP</button>
              <button class="btn warn" type="button" id="ispUpdateBtn">更新已載入個案</button>
              <button class="btn good" type="button" id="ispAutofillBtn">一鍵補齊缺漏目標（自動下一位）</button>
              <button class="btn danger" type="button" id="ispDeleteBtn">刪除整組 ISP</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3>教保老師快速新增單筆目標</h3>
          <form id="ispQuickForm" class="grid-4">
            <div class="field"><label>個案</label><select name="clientName">${clientOptions}</select></div>
            <div class="field"><label>目標類型</label><select name="goalType"><option value="long">長期目標</option><option value="short">短期目標</option></select></div>
            <div class="field" id="quickShortOrderField"><label>短期序號</label><select name="shortOrder"><option value="1">短期1</option><option value="2">短期2</option><option value="3">短期3</option></select></div>
            <div class="field"><label>目標日期</label><input type="date" name="targetDate" value="${today()}" required></div>
            <div class="field" style="grid-column:1 / -1;"><label id="quickGoalLabel">目標內容</label><input name="goal" required placeholder="請輸入長期或短期目標"></div>
            <div class="field" style="grid-column:1 / -1;"><label>通過標準</label><input name="passCriteria" required placeholder="例如：兩週平均達成率 >= 80%"></div>
            <div class="actions" style="grid-column:1 / -1;">
              <button class="btn primary" type="submit">新增/覆蓋單筆目標</button>

          </form>
          <p class="mini">說明：長期目標僅保留 1 筆；短期目標可指定短期1~3。教保老師可新增自己班級個案目標。</p>
        </div>

        <div class="card">
          <h3>ISP 個案列表（管理 / 查看 / 預覽）</h3>
          <div class="grid-4" style="margin-bottom:10px;">
            <div class="field"><label>清單篩選</label><select id="ispListFilter"><option ${ispListFilterMode === "全部" ? "selected" : ""}>全部</option><option ${ispListFilterMode === "缺漏" ? "selected" : ""}>缺漏</option></select></div>
            <div class="field"><label>排序方式</label><select id="ispSortMode"><option ${ispSortMode === "最新更新" ? "selected" : ""}>最新更新</option><option ${ispSortMode === "缺漏優先" ? "selected" : ""}>缺漏優先</option><option ${ispSortMode === "個案名稱" ? "selected" : ""}>個案名稱</option></select></div>

            <div class="field ${ispRecentFilter === "自訂區間" ? "" : "hidden"}" id="ispRecentStartField"><label>更新起日</label><input type="date" id="ispRecentStartDate" value="${ispRecentStartDate}" /></div>

            <div class="actions ${ispRecentFilter === "自訂區間" ? "" : "hidden"}" id="ispRecentPresetActions" style="grid-column: 1 / -1;">
              <button class="btn" type="button" data-isp-recent-preset="today">今天</button>
              <button class="btn" type="button" data-isp-recent-preset="7d">近7天</button>

              <button class="btn" type="button" id="ispResetFiltersBtn">清空篩選</button>
              <button class="btn primary" type="button" id="ispExportCurrentBtn">匯出目前清單 Excel</button>
            </div>

      const table = host.querySelector("#ispTable");

        const shortLines = pkg.shorts
          .slice(0, 3)
          .map((s, idx) => `<div class="mini">短${idx + 1}：${s.passCriteria || "-"}</div>`)
          .join("");
        const shortValidCount = pkg.shortValidCount;
        const hasLong = pkg.hasLong;
        const isComplete = pkg.isComplete;
        const longSummary = pkg.long ? pkg.long.goal : "未設定";
        const passSummary = pkg.long
          ? `<div class="mini">長期：${pkg.long.passCriteria || "-"}</div>${shortLines}`
          : "<span class='mini'>尚未設定</span>";
        const statusText = isComplete
          ? `<span class="badge good">完整 3/3</span>`
          : `<span class="badge risk">缺漏 ${hasLong ? "短期" : "長期+短期"}</span>`;

        const isFlashRow = state.ispFlashClient === pkg.clientName;

        }, 1300);

      const quickShortOrderField = host.querySelector("#quickShortOrderField");

      ispOnlyMissingBtn.addEventListener("click", () => {

        state.ispSortMode = ispSortModeSelect.value;

      ispResetFiltersBtn.addEventListener("click", () => {
        state.ispListFilterMode = "全部";

        state.ispRecentStartDate = "";
