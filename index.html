      const ispRecentStartDateInput = host.querySelector("#ispRecentStartDate");
      const ispRecentEndDateInput = host.querySelector("#ispRecentEndDate");
      const ispRecentPresetActions = host.querySelector("#ispRecentPresetActions");
      function normalizeRecentRange() {
        if (!ispRecentStartDateInput || !ispRecentEndDateInput) return false;
        const start = String(ispRecentStartDateInput.value || "");
        const end = String(ispRecentEndDateInput.value || "");
        if (!start || !end) return false;
        if (start <= end) return false;
        ispRecentStartDateInput.value = end;
        ispRecentEndDateInput.value = start;
        state.ispRecentStartDate = end;
        state.ispRecentEndDate = start;
        log("ISP更新區間校正", `起訖日期已自動交換：${end} ~ ${start}`);
        return true;
      }

      function applyIspRecentPreset(preset) {
        const now = new Date();
        const todayStr = isoDateFromMs(now.getTime());
        let startStr = todayStr;
        let endStr = todayStr;

        if (preset === "7d") {
          startStr = isoDateFromMs(now.getTime() - (6 * 24 * 60 * 60 * 1000));
        }
        if (preset === "30d") {
          startStr = isoDateFromMs(now.getTime() - (29 * 24 * 60 * 60 * 1000));
        }
        if (preset === "month") {
          startStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-01`;
        }

        state.ispRecentFilter = "自訂區間";
        state.ispRecentStartDate = startStr;
        state.ispRecentEndDate = endStr;
        renderIsp();
      }

      if (ispRecentStartDateInput) {
        ispRecentStartDateInput.addEventListener("change", () => {
          state.ispRecentStartDate = ispRecentStartDateInput.value;
          normalizeRecentRange();
          renderIsp();
        });
      }
      if (ispRecentEndDateInput) {
        ispRecentEndDateInput.addEventListener("change", () => {
          state.ispRecentEndDate = ispRecentEndDateInput.value;
          normalizeRecentRange();
          renderIsp();
        });
      }
      if (ispRecentPresetActions) {
        ispRecentPresetActions.addEventListener("click", e => {
          const btn = e.target.closest("button[data-isp-recent-preset]");
          if (!btn) return;
          const preset = String(btn.dataset.ispRecentPreset || "");
          if (!preset) return;
          applyIspRecentPreset(preset);
        });
      }
      function getClientIspEntries(clientName) {
        return state.isps
          .filter(x => x.clientName === clientName)
          .sort((a, b) => {
            const ta = a.type === "長期目標" ? 0 : 1;
            const tb = b.type === "長期目標" ? 0 : 1;
            if (ta !== tb) return ta - tb;
            return Number(a.shortOrder || 99) - Number(b.shortOrder || 99);
          });
      }

      function isClientIspComplete(clientName) {
        const list = getClientIspEntries(clientName);
        const long = list.find(x => x.type === "長期目標");
        const shorts = list.filter(x => x.type === "短期目標");
        const hasLong = !!(long && String(long.goal || "").trim() && String(long.passCriteria || "").trim());
        const shortValidCount = shorts.filter(s => String(s.goal || "").trim() && String(s.passCriteria || "").trim()).length;
        return hasLong && shortValidCount >= 3;
      }

      function findNextMissingClient(afterClientName) {
        const names = state.clients.map(c => c.name);
        const start = Math.max(0, names.indexOf(afterClientName));
        for (let i = start + 1; i < names.length; i++) {
          if (!isClientIspComplete(names[i])) return names[i];
        }
        for (let i = 0; i <= start; i++) {
          if (!isClientIspComplete(names[i])) return names[i];
        }
        return "";
      }

      function jumpToNextMissingClient(fromClientName) {
        const nextClient = findNextMissingClient(fromClientName);
        if (!nextClient) {
          alert("已完成全部個案 ISP（長期1 + 短期3）");
          if (state.ispListFilterMode === "缺漏") {
            state.ispListFilterMode = "全部";
          }
          renderIsp();
          return;
        }
        state.selectedClient = nextClient;
        state.selectedIspForEdit = nextClient;
        fillFilters();
        renderIsp();
      }

      function fillFormByClient(clientName) {
        const list = getClientIspEntries(clientName);
        const long = list.find(x => x.type === "長期目標");
        const shorts = list.filter(x => x.type === "短期目標").sort((a, b) => Number(a.shortOrder || 99) - Number(b.shortOrder || 99));
        form.elements["clientName"].value = clientName;
        form.elements["targetDate"].value = (long && long.targetDate) || (shorts[0] && shorts[0].targetDate) || today();
        form.elements["progress"].value = ((long && long.progress) || (shorts[0] && shorts[0].progress) || []).join(",");
        form.elements["longGoal"].value = (long && long.goal) || "";
        form.elements["longPassCriteria"].value = (long && long.passCriteria) || "";
        form.elements["shortGoal1"].value = (shorts[0] && shorts[0].goal) || "";
        form.elements["shortPassCriteria1"].value = (shorts[0] && shorts[0].passCriteria) || "";
        form.elements["shortGoal2"].value = (shorts[1] && shorts[1].goal) || "";
        form.elements["shortPassCriteria2"].value = (shorts[1] && shorts[1].passCriteria) || "";
        form.elements["shortGoal3"].value = (shorts[2] && shorts[2].goal) || "";
        form.elements["shortPassCriteria3"].value = (shorts[2] && shorts[2].passCriteria) || "";
        fillQuickFormByClient(clientName);
      }

      function syncQuickGoalTypeUI() {
        if (!quickForm) return;
        const isLong = String(quickGoalTypeSelect && quickGoalTypeSelect.value) === "long";
        if (quickShortOrderField) {
          quickShortOrderField.style.display = isLong ? "none" : "";
        }
        if (quickShortOrderSelect) {
          quickShortOrderSelect.disabled = isLong;
        }
        if (quickGoalLabel) {
          quickGoalLabel.textContent = isLong ? "長期目標內容" : "短期目標內容";
        }
      }

      function fillQuickFormByClient(clientName) {
        if (!quickForm) return;
        const list = getClientIspEntries(clientName);
        const long = list.find(x => x.type === "長期目標");
        const shorts = list.filter(x => x.type === "短期目標").sort((a, b) => Number(a.shortOrder || 99) - Number(b.shortOrder || 99));
        const firstShort = shorts[0] || null;
        const targetDate = (long && long.targetDate) || (firstShort && firstShort.targetDate) || today();

        quickForm.elements["clientName"].value = clientName;
        quickForm.elements["targetDate"].value = targetDate;

        if (long) {
          quickForm.elements["goalType"].value = "long";
          quickForm.elements["goal"].value = long.goal || "";
          quickForm.elements["passCriteria"].value = long.passCriteria || "";
        } else if (firstShort) {
          quickForm.elements["goalType"].value = "short";
          quickForm.elements["shortOrder"].value = String(firstShort.shortOrder || 1);
          quickForm.elements["goal"].value = firstShort.goal || "";
          quickForm.elements["passCriteria"].value = firstShort.passCriteria || "";
        } else {
          quickForm.elements["goalType"].value = "long";
          quickForm.elements["shortOrder"].value = "1";
          quickForm.elements["goal"].value = "";
          quickForm.elements["passCriteria"].value = "";
        }

        syncQuickGoalTypeUI();
      }

      function saveSingleIspGoal(payload) {
        const updatedAtIso = new Date().toISOString();
        const actor = getCurrentActor();
        const existingAll = state.isps.filter(x => x.clientName === payload.clientName);
        if (payload.goalType === "long") {
          const target = existingAll.find(x => x.type === "長期目標");
          if (target) {
            if (!canManageOwner(target.createdBy)) {
              alert("無法覆蓋此長期目標：建立者權限不足");
              return false;
            }
            target.goal = payload.goal;
            target.passCriteria = payload.passCriteria;
            target.targetDate = payload.targetDate;
            target.updatedBy = actor;
            target.updatedAtIso = updatedAtIso;
          } else {
            state.isps.push({
              id: id(),
              clientName: payload.clientName,
              type: "長期目標",
              goal: payload.goal,
              passCriteria: payload.passCriteria,
              targetDate: payload.targetDate,
              createdBy: actor,
              updatedBy: actor,
              createdAtIso: updatedAtIso,
              updatedAtIso,
              progress: [],
              shortOrder: 0
            });
          }
          state.ispFlashClient = payload.clientName;
          return true;
        }

        const order = Number(payload.shortOrder || 1);
        const target = existingAll.find(x => x.type === "短期目標" && Number(x.shortOrder || 99) === order);
        if (target) {
          if (!canManageOwner(target.createdBy)) {
            alert(`無法覆蓋短期目標${order}：建立者權限不足`);
            return false;
          }
          target.goal = payload.goal;
          target.passCriteria = payload.passCriteria;
          target.targetDate = payload.targetDate;
          target.updatedBy = actor;
          target.updatedAtIso = updatedAtIso;
        } else {
          state.isps.push({
            id: id(),
            clientName: payload.clientName,
            type: "短期目標",
            goal: payload.goal,
            passCriteria: payload.passCriteria,
            targetDate: payload.targetDate,
            createdBy: actor,
            updatedBy: actor,
            createdAtIso: updatedAtIso,
            updatedAtIso,
            progress: [],
            shortOrder: order
          });
        }
        state.ispFlashClient = payload.clientName;
        return true;
      }

      function buildAutofillPackage(clientName) {
        const list = getClientIspEntries(clientName);
        const long = list.find(x => x.type === "長期目標");
        const shorts = list.filter(x => x.type === "短期目標").sort((a, b) => Number(a.shortOrder || 99) - Number(b.shortOrder || 99));
        const targetDate = (long && long.targetDate) || (shorts[0] && shorts[0].targetDate) || today();
        const progress = (long && long.progress) || (shorts[0] && shorts[0].progress) || [];

        const entries = [];
        entries.push({
          id: (long && long.id) || id(),
          clientName,
          type: "長期目標",
          goal: (long && String(long.goal || "").trim()) || `長期目標：${clientName} 日常生活能力穩定提升`,
          passCriteria: (long && String(long.passCriteria || "").trim()) || "連續4週達成率 >= 85%",
          targetDate,
          createdBy: (long && long.createdBy) || getCurrentActor(),
          progress,
          shortOrder: 0
        });

        for (let idx = 0; idx < 3; idx++) {
          const s = shorts[idx];
          entries.push({
            id: (s && s.id) || id(),
            clientName,
            type: "短期目標",
            goal: (s && String(s.goal || "").trim()) || `短期目標${idx + 1}：待補內容`,
            passCriteria: (s && String(s.passCriteria || "").trim()) || "兩週平均達成率 >= 80%",
            targetDate,
            createdBy: (s && s.createdBy) || getCurrentActor(),
            progress,
            shortOrder: idx + 1
          });
        }

        return { clientName, entries };
      }

      function buildPackageFromForm() {
        const fd = new FormData(form);
        const clientName = String(fd.get("clientName") || "").trim();
        const targetDate = String(fd.get("targetDate") || "").trim();
        const longGoal = String(fd.get("longGoal") || "").trim();
        const longPassCriteria = String(fd.get("longPassCriteria") || "").trim();
        const shortGoal1 = String(fd.get("shortGoal1") || "").trim();
        const shortPassCriteria1 = String(fd.get("shortPassCriteria1") || "").trim();
        const shortGoal2 = String(fd.get("shortGoal2") || "").trim();
        const shortPassCriteria2 = String(fd.get("shortPassCriteria2") || "").trim();
        const shortGoal3 = String(fd.get("shortGoal3") || "").trim();
        const shortPassCriteria3 = String(fd.get("shortPassCriteria3") || "").trim();
        const progress = String(fd.get("progress") || "").split(",").map(s => Number(s.trim())).filter(n => !Number.isNaN(n));

        if (!clientName || !targetDate || !longGoal || !longPassCriteria || !shortGoal1 || !shortPassCriteria1 || !shortGoal2 || !shortPassCriteria2 || !shortGoal3 || !shortPassCriteria3) {
          alert("請完整填寫：1 個長期目標、3 個短期目標與所有通過標準");
          return null;
        }

        return {
          clientName,
          entries: [
            {
              id: id(),
              clientName,
              type: "長期目標",
              goal: longGoal,
              passCriteria: longPassCriteria,
              targetDate,
              createdBy: getCurrentActor(),
              progress,
              shortOrder: 0
            },
            {
              id: id(),
              clientName,
              type: "短期目標",
              goal: shortGoal1,
              passCriteria: shortPassCriteria1,
              targetDate,
              createdBy: getCurrentActor(),
              progress,
              shortOrder: 1
            },
            {
              id: id(),
              clientName,
              type: "短期目標",
              goal: shortGoal2,
              passCriteria: shortPassCriteria2,
              targetDate,
              createdBy: getCurrentActor(),
              progress,
              shortOrder: 2
            },
            {
              id: id(),
              clientName,
              type: "短期目標",
              goal: shortGoal3,
              passCriteria: shortPassCriteria3,
              targetDate,
              createdBy: getCurrentActor(),
              progress,
              shortOrder: 3
            }
          ]
        };
      }

      function saveClientIspPackage(clientName, entries, modeText) {
        const updatedAtIso = new Date().toISOString();
        const actor = getCurrentActor();
        const existing = state.isps.filter(i => i.clientName === clientName);
        const hasNoPermission = existing.some(x => !canManageOwner(x.createdBy));
        if (hasNoPermission) {
          alert(`無法覆蓋 ${clientName} 的 ISP：包含其他建立者資料`);
          log("拒絕更新 ISP", `${clientName} / 建立者權限不足`);
          return false;
        }
        const stampedEntries = entries.map(item => ({
          ...item,
          createdBy: item.createdBy || actor,
          createdAtIso: item.createdAtIso || updatedAtIso,
          updatedBy: actor,
          updatedAtIso
        }));
        state.isps = state.isps.filter(i => i.clientName !== clientName);
        state.isps.push(...stampedEntries);
        state.selectedIspForEdit = clientName;
        state.ispFlashClient = clientName;
        log(modeText, `${clientName} / 長期1 + 短期3`);
        renderIsp();
        return true;
      }

          const ok = saveClientIspPackage(pkg.clientName, pkg.entries, "補齊 ISP 缺漏");
          if (ok) jumpToNextMissingClient(clientName);
        }
      });

      });
    }

    function ensureAnalysisState() {
      if (!state.analysisLevel) state.analysisLevel = "全機構";
      if (!state.lastAnalysisFilterSourceKey) state.lastAnalysisFilterSourceKey = "completion";
      if (!state.chartFilters) state.chartFilters = {};
      const keys = ["overview", "completion", "isp", "tokenTrend", "promptLevel", "classToken", "radar", "workCompletion", "taskProgress", "teacher", "ai", "media"];
      let created = false;
      keys.forEach(key => {
        if (!state.chartFilters[key]) {
          state.chartFilters[key] = {
            period: "本週",
            className: "全部班級",
            clientName: "全部個案",
            taskName: "全部工作",
            startDate: "",
            endDate: "",
            granularity: "月"
          };
          created = true;
        }
      });
      applyLevelDefaults({ force: created });
      syncAnalysisFiltersWithToolbar();
    }

    function syncAnalysisFiltersWithToolbar() {
      if (!state.chartFilters) return;
      const toolbarClass = state.selectedClass;
      const toolbarClient = state.selectedClient;
      const classOptions = ["全部班級", ...state.classes];
      Object.keys(state.chartFilters).forEach(key => {
        const filter = state.chartFilters[key];
        if (!filter) return;

        if (toolbarClass !== "全部班級" && classOptions.includes(toolbarClass) && filter.className === "全部班級") {
          filter.className = toolbarClass;
        }

        let clientList = getClientsByClass(filter.className);
        if (toolbarClient !== "全部個案" && filter.clientName === "全部個案" && clientList.includes(toolbarClient)) {
          filter.clientName = toolbarClient;
        }

        clientList = getClientsByClass(filter.className);
        if (filter.clientName !== "全部個案" && !clientList.includes(filter.clientName)) {
          filter.clientName = clientList[0] || "全部個案";
        }
      });
    }

    function applyAnalysisClassClientToAll(sourceKey) {
      const source = state.chartFilters && state.chartFilters[sourceKey];
      if (!source) return false;
      const sourceClass = source.className || "全部班級";
      const sourceClient = source.clientName || "全部個案";
      let changed = false;

      Object.keys(state.chartFilters).forEach(key => {
        const filter = state.chartFilters[key];
        if (!filter) return;
        if (filter.className !== sourceClass) {
          filter.className = sourceClass;
          changed = true;
        }

        const clientOptions = getClientsByClass(filter.className);
        let nextClient = sourceClient;
        if (nextClient !== "全部個案" && !clientOptions.includes(nextClient)) {
          nextClient = clientOptions[0] || "全部個案";
        }
        if (filter.clientName !== nextClient) {
          filter.clientName = nextClient;
          changed = true;
        }
      });

      return changed;
    }

    function getAllowedAnalysisLevels() {
      if (state.role === "teacher") return ["班級", "個人"];
      return ["全機構", "班級", "個人"];
    }

    function renderChartFilter(key) {
      const f = state.chartFilters[key];
      const classOpts = ["全部班級", ...state.classes].map(v => `<option ${f.className === v ? "selected" : ""}>${v}</option>`).join("");
      const clientOpts = ["全部個案", ...getClientsByClass(f.className)].map(v => `<option ${f.clientName === v ? "selected" : ""}>${v}</option>`).join("");
      const workOpts = ["全部工作", ...state.tasks.map(t => t.name)].map(v => `<option ${f.taskName === v ? "selected" : ""}>${v}</option>`).join("");
      return `
        <div class="grid-4">
          <div class="field"><label>日期</label><select data-ckey="${key}" data-cfield="period"><option ${f.period === "今日" ? "selected" : ""}>今日</option><option ${f.period === "本週" ? "selected" : ""}>本週</option><option ${f.period === "本月" ? "selected" : ""}>本月</option><option ${f.period === "自訂" ? "selected" : ""}>自訂</option></select></div>
          <div class="field"><label>班級</label><select data-ckey="${key}" data-cfield="className">${classOpts}</select></div>
          <div class="field"><label>個案</label><select data-ckey="${key}" data-cfield="clientName">${clientOpts}</select></div>
          <div class="field"><label>工作項目</label><select data-ckey="${key}" data-cfield="taskName">${workOpts}</select></div>
        </div>
        <div class="grid-2 ${f.period === "自訂" ? "" : "hidden"}">
          <div class="field"><label>起始日</label><input type="date" value="${f.startDate}" data-ckey="${key}" data-cfield="startDate"></div>
          <div class="field"><label>結束日</label><input type="date" value="${f.endDate}" data-ckey="${key}" data-cfield="endDate"></div>
        </div>
      `;
    }

    function bindAnalysisEvents() {
      document.getElementById("analysisLevelSelect").value = state.analysisLevel;
      document.getElementById("analysisLevelSelect").addEventListener("change", e => {
        state.analysisLevel = e.target.value;
        applyLevelDefaults({ force: true });
        renderAnalysis();
      });

      document.getElementById("syncToolbarFilterBtn").addEventListener("click", () => {
        state.selectedClass = state.chartFilters.completion.className;
        state.selectedClient = state.chartFilters.completion.clientName;
        fillFilters();
        log("同步篩選", "分析中心 -> 工具列");
      });

      document.getElementById("syncAllAnalysisFiltersBtn").addEventListener("click", () => {
        const sourceKey = state.lastAnalysisFilterSourceKey || "completion";
        const changed = applyAnalysisClassClientToAll(sourceKey);
        if (changed) {
          renderAnalysis();
        }
        log("整頁篩選同步", `${sourceKey} -> 全部圖表（班級/個案）`);
      });

      document.querySelectorAll("[data-ckey][data-cfield]").forEach(el => {
        el.addEventListener("change", e => {
          const key = e.target.dataset.ckey;
          const field = e.target.dataset.cfield;
          const nextValue = e.target.value;
          if (state.chartFilters[key][field] === nextValue && field !== "className") return;
          state.chartFilters[key][field] = nextValue;
          if (field === "className") {
            state.lastAnalysisFilterSourceKey = key;
            const clientOptions = getClientsByClass(nextValue);
            const currentClient = state.chartFilters[key].clientName;
            if (state.analysisLevel === "個人") {
              state.chartFilters[key].clientName = clientOptions.includes(currentClient)
                ? currentClient
                : (clientOptions[0] || "全部個案");
            } else if (currentClient !== "全部個案" && !clientOptions.includes(currentClient)) {
              state.chartFilters[key].clientName = clientOptions[0] || "全部個案";
            }
          }
          if (field === "clientName" && state.analysisLevel === "個人" && nextValue === "全部個案") {
            state.lastAnalysisFilterSourceKey = key;
            const list = getClientsByClass(state.chartFilters[key].className);
            if (list.length) {
              state.chartFilters[key].clientName = list[0];
            }
          }
          if (field === "clientName" && nextValue !== "全部個案") {
            state.lastAnalysisFilterSourceKey = key;
          }
          if (key === "completion") {
            state.chartFilters.overview = { ...state.chartFilters.completion };
          }
          renderAnalysis();
        });
      });

      document.querySelectorAll("[data-granularity-key]").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.granularityKey;
          state.chartFilters[key].granularity = btn.dataset.granularity;
          renderAnalysis();
        });
      });

      const emotionPeriodSelect = document.getElementById("emotionPeriodSelect");
      if (emotionPeriodSelect) {
        emotionPeriodSelect.addEventListener("change", e => {
          state.emotionAnalysisPeriod = e.target.value;
          renderAnalysis();
        });
      }
    }

    function applyLevelDefaults({ force = false } = {}) {
      const keys = Object.keys(state.chartFilters || {});
      const classOptions = ["全部班級", ...state.classes];
      if (state.analysisLevel === "班級") {
        const targetClass = state.selectedClass !== "全部班級" ? state.selectedClass : (state.classes[0] || "全部班級");
        keys.forEach(k => {
          const filter = state.chartFilters[k];
          if (force || !classOptions.includes(filter.className) || filter.className === "全部班級") {
            filter.className = targetClass;
          }
          const list = getClientsByClass(filter.className);
          if (force) {
            filter.clientName = list[0] || "全部個案";
          } else if (filter.clientName !== "全部個案" && !list.includes(filter.clientName)) {
            filter.clientName = list[0] || "全部個案";
          }
        });
      }
      if (state.analysisLevel === "個人") {
        const targetClient = state.selectedClient !== "全部個案"
          ? state.selectedClient
          : (state.clients[0] ? state.clients[0].name : "全部個案");
        keys.forEach(k => {
          const filter = state.chartFilters[k];
          if (force || filter.clientName === "全部個案" || !state.clients.some(x => x.name === filter.clientName)) {
            filter.clientName = targetClient;
          }
          const c = state.clients.find(x => x.name === filter.clientName);
          if (c) {
            filter.className = c.className;
          } else if (force) {
            filter.className = "全部班級";
          }
        });
      }
      if (state.analysisLevel === "全機構") {
        keys.forEach(k => {
          const filter = state.chartFilters[k];
          if (!classOptions.includes(filter.className)) filter.className = "全部班級";
          const list = getClientsByClass(filter.className);
          if (filter.clientName !== "全部個案" && !list.includes(filter.clientName)) {
            filter.clientName = "全部個案";
          }
        });
      }
    }

    function getClientsByClass(className) {
      return state.clients
        .filter(c => className === "全部班級" || c.className === className)
        .map(c => c.name);
    }

    function getRecordsByFilter(filter, level) {
      const f = normalizeFilterByLevel(filter, level);
      const now = new Date();
      return state.records.filter(r => {
        const classOk = f.className === "全部班級" || r.className === f.className;
        const clientOk = f.clientName === "全部個案" || r.clientName === f.clientName;
        const taskOk = f.taskName === "全部工作" || r.taskName === f.taskName;
        if (!classOk || !clientOk || !taskOk) return false;

        const d = new Date(r.date + "T00:00:00");
        if (f.period === "今日") return r.date === today();
        if (f.period === "本週") return daysDiff(now, d) <= 7;
        if (f.period === "本月") return daysDiff(now, d) <= 30;
        if (f.period === "自訂") {
          if (!f.startDate || !f.endDate) return true;
          return r.date >= f.startDate && r.date <= f.endDate;
        }
        return true;
      });
    }

    function normalizeFilterByLevel(filter, level) {
      const f = { ...filter };
      if (level === "班級") {
        if (f.className === "全部班級") f.className = state.selectedClass !== "全部班級" ? state.selectedClass : (state.classes[0] || "全部班級");
        const list = getClientsByClass(f.className);
        if (f.clientName !== "全部個案" && !list.includes(f.clientName)) {
          f.clientName = list[0] || "全部個案";
        }
      }
      if (level === "個人") {
        if (f.className === "全部班級") {
          const client = state.selectedClient !== "全部個案" ? state.selectedClient : (state.clients[0] ? state.clients[0].name : "全部個案");
          const c = state.clients.find(x => x.name === client);
          if (c) f.className = c.className;
        }
        if (f.clientName === "全部個案") {
          const list = getClientsByClass(f.className);
          f.clientName = state.selectedClient !== "全部個案" ? state.selectedClient : (list[0] || "全部個案");
        }
      }
      return f;
    }

    function daysDiff(a, b) {
      return Math.floor((a - b) / (1000 * 60 * 60 * 24));
    }

    function buildAnalysisCenter() {
      const completionRecs = getRecordsByFilter(state.chartFilters.completion, state.analysisLevel);
      const ispRecs = getRecordsByFilter(state.chartFilters.isp, state.analysisLevel);
      const tokenRecs = getRecordsByFilter(state.chartFilters.tokenTrend, state.analysisLevel);
      const promptRecs = getRecordsByFilter(state.chartFilters.promptLevel, state.analysisLevel);
      const classTokenRecs = getRecordsByFilter(state.chartFilters.classToken, state.analysisLevel);
      const radarRecs = getRecordsByFilter(state.chartFilters.radar, state.analysisLevel);
      const workRecs = getRecordsByFilter(state.chartFilters.workCompletion, state.analysisLevel);
      const taskRecs = getRecordsByFilter(state.chartFilters.taskProgress, state.analysisLevel);
      const teacherRecs = getRecordsByFilter(state.chartFilters.teacher, state.analysisLevel);
      const aiRecs = getRecordsByFilter(state.chartFilters.ai, state.analysisLevel);
      const mediaRecs = getRecordsByFilter(state.chartFilters.media, state.analysisLevel);

      buildCompletionTrendChart(completionRecs);
      buildIspTrendChart();
      buildTokenTrendChart(tokenRecs);
      buildPromptLevelChart(promptRecs);
      buildClassTokenCompareChart(classTokenRecs);
      buildAbilityRadarChart(radarRecs);
      buildTaskProgressChart(taskRecs);
      renderWorkCompletion(workRecs);
      renderTeacherStats(teacherRecs);
      renderAiJudgement(aiRecs);
      renderMediaRecords(mediaRecs);
      renderEmotionAnalysisInsights();
    }

    function getPeriodRange(base, period, offset = 0) {
      const now = new Date(base);
      if (period === "日") {
        const d = new Date(now);
        d.setDate(d.getDate() + offset);
        const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const end = new Date(start);
        end.setDate(end.getDate() + 1);
        return { start, end };
      }
      if (period === "週") {
        const d = new Date(now);
        d.setDate(d.getDate() + offset * 7);
        const day = d.getDay() || 7;
        const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (day - 1));
        const end = new Date(start);
        end.setDate(end.getDate() + 7);
        return { start, end };
      }
      if (period === "季") {
        const d = new Date(now);
        d.setMonth(d.getMonth() + offset * 3);
        const quarter = Math.floor(d.getMonth() / 3);
        const start = new Date(d.getFullYear(), quarter * 3, 1);
        const end = new Date(start);
        end.setMonth(end.getMonth() + 3);
        return { start, end };
      }
      const d = new Date(now);
      d.setMonth(d.getMonth() + offset);
      const start = new Date(d.getFullYear(), d.getMonth(), 1);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      return { start, end };
    }

    function inRange(dateStr, range) {
      if (!dateStr) return false;
      const d = new Date(dateStr + "T00:00:00");
      return d >= range.start && d < range.end;
    }

    function getTimeSlotLabel(timeText) {
      const hour = Number(String(timeText || "00:00").split(":")[0] || 0);
      if (hour < 9) return "07:00-09:00";
      if (hour < 11) return "09:00-11:00";
      if (hour < 13) return "11:00-13:00";
      if (hour < 15) return "13:00-15:00";
      if (hour < 17) return "15:00-17:00";
      return "17:00-20:00";
    }

    function pickTopEntry(mapObj) {
      const entries = Object.entries(mapObj);
      if (!entries.length) return "無";
      return entries.sort((a, b) => b[1] - a[1])[0][0];
    }

    function renderEmotionAnalysisInsights() {
      const period = state.emotionAnalysisPeriod || "月";
      const currentRange = getPeriodRange(new Date(), period, 0);
      const prevRange = getPeriodRange(new Date(), period, -1);
      const permitted = new Set(getPermittedClientNames());

      const currentEmotion = state.emotionRecords.filter(x => permitted.has(x.clientName) && inRange(x.date, currentRange));
      const prevEvents = state.behaviorEvents.filter(x => permitted.has(x.clientName) && inRange(x.date, prevRange));
      const currentEvents = state.behaviorEvents.filter(x => permitted.has(x.clientName) && inRange(x.date, currentRange));

      const happyDays = new Set(currentEmotion.filter(x => /愉快|平穩/.test(String(x.emotion || ""))).map(x => x.date)).size;
      const anxietyDays = new Set(currentEmotion.filter(x => /焦慮|難過|生氣/.test(String(x.emotion || ""))).map(x => x.date)).size;
      const eventCount = currentEvents.length;
      const trendDelta = eventCount - prevEvents.length;
      const trendText = trendDelta === 0 ? "持平" : (trendDelta < 0 ? `下降 ${Math.abs(trendDelta)} 次` : `增加 ${trendDelta} 次`);

      const timeMap = {};
      const locationMap = {};
      const activityMap = {};
      const staffMap = {};
      currentEvents.forEach(e => {
        const slot = getTimeSlotLabel(e.time);
        timeMap[slot] = (timeMap[slot] || 0) + 1;
        locationMap[e.location || "未填"] = (locationMap[e.location || "未填"] || 0) + 1;
        activityMap[e.activity || "未填"] = (activityMap[e.activity || "未填"] || 0) + 1;
        const k = e.createdBy || "未填";
        if (!staffMap[k]) staffMap[k] = { total: 0, recover: 0 };
        staffMap[k].total += 1;
        staffMap[k].recover += Number(e.recoverMinutes || 0);
      });
      const bestStaff = Object.entries(staffMap)
        .sort((a, b) => (a[1].recover / Math.max(1, a[1].total)) - (b[1].recover / Math.max(1, b[1].total)))[0];

      const happyEl = document.getElementById("emoHappyDays");
      const anxietyEl = document.getElementById("emoAnxietyDays");
      const eventEl = document.getElementById("emoEventCount");
      const trendEl = document.getElementById("emoTrend");
      const hotspotBody = document.getElementById("emotionHotspotBody");
      const aiSummary = document.getElementById("emotionAiSummary");
      if (!happyEl || !anxietyEl || !eventEl || !trendEl || !hotspotBody || !aiSummary) return;

      happyEl.textContent = String(happyDays);
      anxietyEl.textContent = String(anxietyDays);
      eventEl.textContent = String(eventCount);
      trendEl.textContent = trendText;

      hotspotBody.innerHTML = `
        <tr><td>高峰時段</td><td>${pickTopEntry(timeMap)}</td></tr>
        <tr><td>高風險地點</td><td>${pickTopEntry(locationMap)}</td></tr>
        <tr><td>高風險活動</td><td>${pickTopEntry(activityMap)}</td></tr>
        <tr><td>介入效果較佳教保員</td><td>${bestStaff ? `${bestStaff[0]}（平均恢復 ${Math.round(bestStaff[1].recover / Math.max(1, bestStaff[1].total))} 分）` : "無資料"}</td></tr>
      `;

      const improvement = trendDelta < 0 ? `事件由 ${prevEvents.length} 次下降至 ${eventCount} 次` : `事件為 ${eventCount} 次（較前期${trendDelta > 0 ? "增加" : "持平"}）`;
      const topActivity = pickTopEntry(activityMap);
      aiSummary.textContent = `${period}度情緒事件分析：${improvement}，主要熱點為「${topActivity}」。配合代幣制度與介入策略後，建議持續使用固定流程、視覺提示與正向增強。`;
    }

    function upsertChart(chartKey, canvasId, type, data, options = {}) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      const existing = charts[chartKey];
      if (existing && existing.canvas === canvas) {
        existing.config.type = type;
        existing.data = data;
        existing.options = options;
        existing.update("none");
        return;
      }

      if (existing) existing.destroy();
      charts[chartKey] = new Chart(canvas, { type, data, options });
    }

    function calcCompletionRate(recs) {
      if (!recs.length) return 0;
      return Math.round((recs.filter(r => r.completed).length / recs.length) * 100);

    function calcIspRateByLevel(level) {
      let target = state.isps;
      if (level === "班級") {
        const c = state.selectedClass !== "全部班級" ? state.selectedClass : state.classes[0];
        const names = state.clients.filter(x => x.className === c).map(x => x.name);
        target = state.isps.filter(i => names.includes(i.clientName));
      }
      if (level === "個人") {
        const n = state.selectedClient !== "全部個案" ? state.selectedClient : (state.clients[0] ? state.clients[0].name : "");
        target = state.isps.filter(i => i.clientName === n);
      }
      if (!target.length) return 0;
      const values = target.map(i => i.progress.length ? i.progress[i.progress.length - 1] : 0);
      return Math.round(values.reduce((a, b) => a + b, 0) / values.length);
    }

    function getTopPrompt(recs) {
      if (!recs.length) return "無資料";
      const map = {};
      recs.forEach(r => { map[r.prompt] = (map[r.prompt] || 0) + 1; });
      return Object.entries(map).sort((a, b) => b[1] - a[1])[0][0];
    }

    function aggregateLast4Weeks(recs) {
      const now = new Date();
      const buckets = [0, 1, 2, 3].map(i => {
        const start = new Date(now);
        start.setDate(now.getDate() - (27 - i * 7));
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        return { start, end, total: 0, completed: 0, tokens: 0 };
      });
      recs.forEach(r => {
        const d = new Date(r.date + "T00:00:00");
        const b = buckets.find(x => d >= x.start && d <= x.end);
        if (!b) return;
        b.total += 1;
        if (r.completed) b.completed += 1;
        b.tokens += (r.tokenAward - r.tokenDeduct);
      });
      return buckets;
    }

    function groupTokenByPeriod(recs, granularity) {
      const grouped = {};
      recs.forEach(r => {
        const d = new Date(r.date + "T00:00:00");
        let key = "";
        if (granularity === "日") key = r.date;
        if (granularity === "週") key = `${d.getFullYear()}-W${getWeekNumber(d)}`;
        if (granularity === "月") key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        if (granularity === "年") key = `${d.getFullYear()}`;
        if (!grouped[key]) grouped[key] = { total: 0, byTask: {} };
        const token = r.tokenAward - r.tokenDeduct;
        grouped[key].total += token;
        grouped[key].byTask[r.taskName] = (grouped[key].byTask[r.taskName] || 0) + token;
      });
      return Object.fromEntries(Object.entries(grouped).sort((a, b) => a[0].localeCompare(b[0])));
    }

    function getWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    function getTaskMonthlyTrend(task, recs) {
      const months = [1, 2, 3, 4];
      return months.map((m, idx) => {
        const list = recs.filter(r => {
          const d = new Date(r.date + "T00:00:00");
          return d.getMonth() + 1 === m && r.taskName === task;
        });
        if (!list.length) return 60 + idx * 8;
        return calcCompletionRate(list);
      });
    }

    function pushReportItem(payload) {
      const item = {
        id: id(),
        report_id: state.report.id,
        item_type: payload.item_type,
        item_ref_id: payload.item_ref_id,
        title: payload.title,
        sort_order: state.reportItems.length + 1,
        created_by: getCurrentActor(),
        created_at: new Date().toLocaleString("zh-TW"),
        class_name: state.selectedClass,
        client_name: state.selectedClient,
        filter_text: payload.filterText || state.report.period || "本月",
        chart_data: payload.chartData || null,
        ai_text: payload.aiText || "",
        text: payload.text || "",
        png: payload.png || ""
      };
      state.reportItems.push(item);
      normalizeReportSortOrder();
    }

    function getCurrentActor() {
      const options = getRoleOperators(state.role);
      const current = normalizeOperatorName(state.currentOperator);
      const matched = options.find(name => normalizeOperatorName(name) === current);
      state.currentOperator = matched || options[0];
      return state.currentOperator;
    }

    function getCanvasByTemplate(name) {
      const map = {
        "個人代幣趨勢圖": "tokenTrendChart",
        "班級代幣比較圖": "classTokenCompareChart",
        "完成率折線圖": "completionTrendChart",
        "提示層級長條圖": "promptLevelChart",
        "ISP達成率圖": "ispTrendChart",
        "雷達圖": "abilityRadarChart"
      };
      return map[name] || "tokenTrendChart";
    }

    function getBestChartCanvasId() {
      const ids = ["tokenTrendChart", "classTokenCompareChart", "completionTrendChart", "ispTrendChart", "abilityRadarChart"];
      return ids.find(idVal => document.getElementById(idVal)) || "";
    }

    function getCanvasPng(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || !canvas.toDataURL) return "";
      return canvas.toDataURL("image/png");
    }

    function summarizeCurrentData() {
      const recs = state.records.filter(r => {
        const classOk = state.selectedClass === "全部班級" || r.className === state.selectedClass;
        const clientOk = state.selectedClient === "全部個案" || r.clientName === state.selectedClient;
        return classOk && clientOk;
      });
      return {
        count: recs.length,
        completion: calcCompletionRate(recs),
        tokenNet: recs.reduce((acc, r) => acc + r.tokenAward - r.tokenDeduct, 0),
        topPrompt: getTopPrompt(recs)
      };
    }

      const wrap = document.getElementById("reportCollection");

      if (!wrap || !countEl || !titleEl) return;

      titleEl.textContent = state.report.title;
      countEl.textContent = `${Math.max(4, state.reportItems.length)} 頁`;
      wrap.innerHTML = state.reportItems
        .sort((a, b) => a.sort_order - b.sort_order)

          <div class="report-item" draggable="true" data-report-item="${item.id}">

            <div class="actions">
              <button class="btn danger" data-remove-report-item="${item.id}">移除</button>
            </div>
          </div>
        `).join("");

      wrap.querySelectorAll("[data-remove-report-item]").forEach(btn => {
        btn.addEventListener("click", () => {

          if (!target) return;
          if (!canManageOwner(target.created_by)) {
            alert(`無法移除：此報告項目建立者為 ${target.created_by}`);
            log("拒絕移除報告項目", `${target.title} / 建立者:${target.created_by}`);
            return;
          }
          state.reportItems = state.reportItems.filter(x => x.id !== btn.dataset.removeReportItem);
          normalizeReportSortOrder();
          renderReports();
        });
      });
      bindReportDragDrop();
    }

    function bindReportDragDrop() {
      const list = document.getElementById("reportCollection");
      if (!list) return;
      let draggingId = "";
      list.querySelectorAll(".report-item").forEach(el => {
        el.addEventListener("dragstart", () => {
          draggingId = el.dataset.reportItem;
          el.classList.add("dragging");
        });
        el.addEventListener("dragend", () => {
          el.classList.remove("dragging");
        });
        el.addEventListener("dragover", e => e.preventDefault());
        el.addEventListener("drop", () => {
          const targetId = el.dataset.reportItem;
          if (!draggingId || draggingId === targetId) return;
          reorderReportItems(draggingId, targetId);
          renderReports();
        });
      });
    }

    function reorderReportItems(draggingId, targetId) {
      const list = [...state.reportItems].sort((a, b) => a.sort_order - b.sort_order);
      const from = list.findIndex(x => x.id === draggingId);
      const to = list.findIndex(x => x.id === targetId);
      if (from < 0 || to < 0) return;
      const [moved] = list.splice(from, 1);
      list.splice(to, 0, moved);
      state.reportItems = list;
      normalizeReportSortOrder();
    }

    function normalizeReportSortOrder() {
      state.reportItems.forEach((item, idx) => {
        item.sort_order = idx + 1;
      });
    }

    function bindSettingHandlers(host) {
      const syncLinkForm = host.querySelector("#syncLinkForm");
      const syncLinkPreview = host.querySelector("#syncLinkPreview");
      const copySyncLinkBtn = host.querySelector("#copySyncLinkBtn");

      if (syncLinkForm && syncLinkPreview) {
        syncLinkForm.addEventListener("submit", async e => {
          e.preventDefault();
          const nextKey = syncLinkForm.elements["syncKey"].value;
          const nextApi = syncLinkForm.elements["syncApi"].value;
          if (!setCloudSyncKey(nextKey, { updateUrl: true })) {
            alert("同步碼格式不正確，請使用英數、底線或減號");
            return;
          }
          if (!setCloudSyncBaseUrl(nextApi, { updateUrl: true })) {
            alert("同步 API 位址格式不正確，請填寫 https:// 開頭網址或留空");
            return;
          }
          syncLinkForm.elements["syncKey"].value = cloudSyncKey;
          syncLinkForm.elements["syncApi"].value = cloudSyncBaseUrl;
          syncLinkPreview.textContent = getShareSyncLink();
          const syncBtn = document.getElementById("syncNowBtn");
          if (syncBtn) {
            const disabled = !isCloudSyncConfigured();
            syncBtn.disabled = disabled;
            syncBtn.title = disabled ? "尚未設定同步 API：目前僅本機儲存" : "";
          }
          if (isCloudSyncConfigured()) {
            setSyncStatus("已切換同步碼，重新同步中...");
            await reconcileCloudState("切換同步碼");
          } else {
            setSyncStatus("雲端同步停用（未設定同步 API）");
          }
        });
      }

      if (copySyncLinkBtn) {
        copySyncLinkBtn.addEventListener("click", async () => {
          const link = getShareSyncLink();
          const originalText = copySyncLinkBtn.textContent;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(link);
              copySyncLinkBtn.textContent = "已複製";
              copySyncLinkBtn.disabled = true;
              setTimeout(() => {
                copySyncLinkBtn.textContent = originalText;
                copySyncLinkBtn.disabled = false;
              }, 1500);
              return;
            }
          } catch {}
          prompt("請複製這個同步連結", link);
        });
      }

      const classTable = host.querySelector("#classTable");
      classTable.innerHTML = state.classes.map(c => `
        <tr><td>${c}</td><td><button class="btn" data-class-manage="${c}">管理</button></td></tr>
      `).join("");

      const classForm = host.querySelector("#classForm");
      classForm.addEventListener("submit", e => {
        e.preventDefault();
        if (normalizeRole(state.role) === "teacher") return alert("教保員不可新增班級，請改用「修改名稱」");
        const name = classForm.elements["className"].value.trim();
        if (!name) return;
        if (state.classes.includes(name)) return alert("班級已存在");
        state.classes.push(name);
        classForm.reset();
        log("新增班級", name);
        renderAll();
      });

      classTable.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        state.selectedClassForEdit = btn.dataset.classManage;
        classForm.elements["className"].value = state.selectedClassForEdit;
      });

      host.querySelector("#classRenameBtn").addEventListener("click", () => {
        if (!state.selectedClassForEdit) return alert("請先選擇班級");
        if (normalizeRole(state.role) === "teacher") {
          const ownClass = getCurrentTeacherClass();
          if (!ownClass) return alert("目前教保員尚未綁定班級");
          if (state.selectedClassForEdit !== ownClass) return alert("教保員僅可編輯自己的班級");
        }
        const next = classForm.elements["className"].value.trim();
        if (!next) return;
        const idx = state.classes.findIndex(c => c === state.selectedClassForEdit);
        if (idx < 0) return;
        const prev = state.classes[idx];
        state.classes[idx] = next;
        state.clients.forEach(c => { if (c.className === prev) c.className = next; });
        state.teachers.forEach(t => { if (t.className === prev) t.className = next; });
        state.records.forEach(r => { if (r.className === prev) r.className = next; });
        log("修改班級", `${prev} -> ${next}`);
        renderAll();
      });

      host.querySelector("#classDeleteBtn").addEventListener("click", () => {
        if (normalizeRole(state.role) === "teacher") return alert("教保員不可刪除班級");
        if (!state.selectedClassForEdit) return alert("請先選擇班級");
        state.classes = state.classes.filter(c => c !== state.selectedClassForEdit);
        state.clients = state.clients.filter(c => c.className !== state.selectedClassForEdit);
        state.teachers = state.teachers.filter(t => t.className !== state.selectedClassForEdit);
        state.records = state.records.filter(r => r.className !== state.selectedClassForEdit);
        log("刪除班級", state.selectedClassForEdit);
        state.selectedClassForEdit = null;
        renderAll();
      });

      const teacherTable = host.querySelector("#teacherTable");
      teacherTable.innerHTML = state.teachers.map(t => `
        <tr>
          <td><input type="checkbox" data-teacher-select="${t.id}" aria-label="勾選教保員 ${t.name}"></td>
          <td>${t.name}</td><td>${t.className}</td>
          <td><button class="btn" data-teacher-manage="${t.id}">管理</button></td>
        </tr>
      `).join("");

      const teacherSelectAll = host.querySelector("#teacherSelectAll");
      const teacherSelectAllBtn = host.querySelector("#teacherSelectAllBtn");
      const teacherBulkDeleteBtn = host.querySelector("#teacherBulkDeleteBtn");

      function getSelectedTeacherIds() {
        return Array.from(teacherTable.querySelectorAll("[data-teacher-select]:checked")).map(cb => cb.dataset.teacherSelect);
      }

      function setAllTeacherSelection(checked) {
        teacherTable.querySelectorAll("[data-teacher-select]").forEach(cb => {
          cb.checked = checked;
        });
        if (teacherSelectAll) teacherSelectAll.checked = checked;
      }

      function syncTeacherSelectAllState() {
        const list = Array.from(teacherTable.querySelectorAll("[data-teacher-select]"));
        if (!teacherSelectAll) return;
        teacherSelectAll.checked = list.length > 0 && list.every(cb => cb.checked);
      }

      if (teacherSelectAll) {
        teacherSelectAll.addEventListener("change", e => {
          setAllTeacherSelection(e.target.checked);
        });
      }

      if (teacherSelectAllBtn) {
        teacherSelectAllBtn.addEventListener("click", () => {
          const list = Array.from(teacherTable.querySelectorAll("[data-teacher-select]"));
          const shouldSelectAll = list.some(cb => !cb.checked);
          setAllTeacherSelection(shouldSelectAll);
        });
      }

      teacherTable.addEventListener("change", e => {
        const checkbox = e.target.closest("[data-teacher-select]");
        if (!checkbox) return;
        syncTeacherSelectAllState();
      });

      const teacherForm = host.querySelector("#teacherForm");
      teacherForm.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(teacherForm);
        const t = { id: id(), name: fd.get("teacherName"), className: fd.get("teacherClass") };
        state.teachers.push(t);
        log("新增教保員", `${t.name}/${t.className}`);
        renderAll();
      });

      teacherTable.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const t = state.teachers.find(x => x.id === btn.dataset.teacherManage);
        if (!t) return;
        state.selectedTeacherForEdit = t.id;
        teacherForm.elements["teacherName"].value = t.name;
        teacherForm.elements["teacherClass"].value = t.className;
      });

      host.querySelector("#teacherUpdateBtn").addEventListener("click", () => {
        if (!state.selectedTeacherForEdit) return alert("請先管理一位教保員");
        const fd = new FormData(teacherForm);
        const t = state.teachers.find(x => x.id === state.selectedTeacherForEdit);
        if (!t) return;
        const prevName = t.name;
        t.name = fd.get("teacherName");
        t.className = fd.get("teacherClass");
        if (state.currentOperator === prevName) {
          state.currentOperator = t.name;
          syncTeacherScopeByOperator();
        }
        log("更新教保員", `${t.name}/${t.className}`);
        renderAll();
      });

      host.querySelector("#teacherDeleteBtn").addEventListener("click", () => {
        if (state.role === "teacher") return alert("教保員不可刪除教保員帳號");
        if (!state.selectedTeacherForEdit) return alert("請先管理一位教保員");
        const idx = state.teachers.findIndex(x => x.id === state.selectedTeacherForEdit);
        if (idx < 0) return;
        const removed = state.teachers.splice(idx, 1)[0];
        state.selectedTeacherForEdit = null;
        log("刪除教保員", removed.name);
        renderAll();
      });

      if (teacherBulkDeleteBtn) {
        teacherBulkDeleteBtn.addEventListener("click", () => {
          if (state.role === "teacher") return alert("教保員不可刪除教保員帳號");
          const selectedIds = getSelectedTeacherIds();
          if (!selectedIds.length) return alert("請先勾選至少一位教保員");
          const confirmed = confirm(`確定刪除已勾選 ${selectedIds.length} 位教保員嗎？`);
          if (!confirmed) return;

          const selectedSet = new Set(selectedIds);
          const before = state.teachers.length;
          state.teachers = state.teachers.filter(t => !selectedSet.has(t.id));
          const removedCount = before - state.teachers.length;
          if (!removedCount) return alert("沒有可刪除的勾選教保員");
          if (state.selectedTeacherForEdit && selectedSet.has(state.selectedTeacherForEdit)) {
            state.selectedTeacherForEdit = null;
          }
          log("批次刪除教保員", `成功 ${removedCount} 位`);
          renderAll();
        });
      }

      const taskTable = host.querySelector("#taskTable");
      taskTable.innerHTML = state.tasks.map(t => `
        <tr>
          <td><input type="checkbox" data-task-select="${t.id}" aria-label="勾選工作項目 ${t.name}"></td>
          <td>${t.category}</td><td>${t.name}</td><td>${t.defaultToken}</td>
          <td><button class="btn" data-task-manage="${t.id}">管理</button></td>
        </tr>
      `).join("");

      const taskSelectAll = host.querySelector("#taskSelectAll");
      const taskSelectAllBtn = host.querySelector("#taskSelectAllBtn");
      const taskBulkDeleteBtn = host.querySelector("#taskBulkDeleteBtn");

      function getSelectedTaskIds() {
        return Array.from(taskTable.querySelectorAll("[data-task-select]:checked")).map(cb => cb.dataset.taskSelect);
      }

      function setAllTaskSelection(checked) {
        taskTable.querySelectorAll("[data-task-select]").forEach(cb => {
          cb.checked = checked;
        });
        if (taskSelectAll) taskSelectAll.checked = checked;
      }

      function syncTaskSelectAllState() {
        const list = Array.from(taskTable.querySelectorAll("[data-task-select]"));
        if (!taskSelectAll) return;
        taskSelectAll.checked = list.length > 0 && list.every(cb => cb.checked);
      }

      if (taskSelectAll) {
        taskSelectAll.addEventListener("change", e => {
          setAllTaskSelection(e.target.checked);
        });
      }

      if (taskSelectAllBtn) {
        taskSelectAllBtn.addEventListener("click", () => {
          const list = Array.from(taskTable.querySelectorAll("[data-task-select]"));
          const shouldSelectAll = list.some(cb => !cb.checked);
          setAllTaskSelection(shouldSelectAll);
        });
      }

      taskTable.addEventListener("change", e => {
        const checkbox = e.target.closest("[data-task-select]");
        if (!checkbox) return;
        syncTaskSelectAllState();
      });

      const taskForm = host.querySelector("#taskForm");
      taskForm.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(taskForm);
        const t = {
          id: id(),
          category: fd.get("category"),
          name: fd.get("taskName"),
          defaultToken: Number(fd.get("defaultToken") || 0)
        };
        state.tasks.push(t);
        log("新增工作項目", `${t.category}/${t.name}`);
        renderAll();
      });

      taskTable.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const t = state.tasks.find(x => x.id === btn.dataset.taskManage);
        if (!t) return;
        state.selectedTaskForEdit = t.id;
        taskForm.elements["category"].value = t.category;
        taskForm.elements["taskName"].value = t.name;
        taskForm.elements["defaultToken"].value = t.defaultToken;
      });

      host.querySelector("#taskUpdateBtn").addEventListener("click", () => {
        if (!state.selectedTaskForEdit) return alert("請先管理一個工作項目");
        const fd = new FormData(taskForm);
        const t = state.tasks.find(x => x.id === state.selectedTaskForEdit);
        if (!t) return;
        t.category = fd.get("category");
        t.name = fd.get("taskName");
        t.defaultToken = Number(fd.get("defaultToken") || 0);
        log("更新工作項目", `${t.category}/${t.name}`);
        renderAll();
      });

      host.querySelector("#taskDeleteBtn").addEventListener("click", () => {
        if (state.role === "teacher") return alert("教保員不可刪除工作項目");
        if (!state.selectedTaskForEdit) return alert("請先管理一個工作項目");
        const idx = state.tasks.findIndex(x => x.id === state.selectedTaskForEdit);
        if (idx < 0) return;
        const removed = state.tasks.splice(idx, 1)[0];
        state.selectedTaskForEdit = null;
        log("刪除工作項目", `${removed.category}/${removed.name}`);
        renderAll();
      });

      if (taskBulkDeleteBtn) {
        taskBulkDeleteBtn.addEventListener("click", () => {
          if (state.role === "teacher") return alert("教保員不可刪除工作項目");
          const selectedIds = getSelectedTaskIds();
          if (!selectedIds.length) return alert("請先勾選至少一個工作項目");
          const confirmed = confirm(`確定刪除已勾選 ${selectedIds.length} 個工作項目嗎？`);
          if (!confirmed) return;

          const selectedSet = new Set(selectedIds);
          const before = state.tasks.length;
          state.tasks = state.tasks.filter(t => !selectedSet.has(t.id));
          const removedCount = before - state.tasks.length;
          if (!removedCount) return alert("沒有可刪除的勾選工作項目");
          if (state.selectedTaskForEdit && selectedSet.has(state.selectedTaskForEdit)) {
            state.selectedTaskForEdit = null;
          }
          log("批次刪除工作項目", `成功 ${removedCount} 個`);
          renderAll();
        });
      }

      host.querySelector("#purgeDemoDataBtn").addEventListener("click", async e => {
        await purgeDemoDataAndSync(e.currentTarget);
      });

      const qaBtn = host.querySelector("#runQaSmokeBtn");
      if (qaBtn) {
        qaBtn.addEventListener("click", () => {
          runQaSmokeCheck();
        });
      }
    }

    function runQaSmokeCheck() {
      const lines = [];
      const fails = [];
      const mark = (ok, title, detail = "") => {
        lines.push(`${ok ? "[OK]" : "[FAIL]"} ${title}${detail ? `: ${detail}` : ""}`);
        if (!ok) fails.push(title);
      };

      const roleSelect = document.getElementById("roleSelect");
      const operatorSelect = document.getElementById("operatorSelect");
      const classFilter = document.getElementById("classFilter");
      const clientFilter = document.getElementById("clientFilter");
      const mobileLinks = Array.from(document.querySelectorAll("#view-mobile a.btn"));

      mark(!!roleSelect, "角色切換欄位存在");
      mark(!!operatorSelect, "操作者切換欄位存在");
      mark(!!classFilter, "班級切換欄位存在");
      mark(!!clientFilter, "個案切換欄位存在");

      const requiredInputs = [
        document.querySelector("#classForm input[name='className']"),
        document.querySelector("#teacherForm input[name='teacherName']"),
        document.querySelector("#taskForm input[name='taskName']")
      ];
      const writableCount = requiredInputs.filter(el => !!el && !el.disabled && !el.readOnly).length;
      mark(writableCount === requiredInputs.length, "主要輸入欄位可輸入", `${writableCount}/${requiredInputs.length}`);

      const teacherNames = getRoleOperators("teacher");
      mark(teacherNames.length > 0, "教保員名單可用", `${teacherNames.length} 位`);

      const snapshot = {
        role: state.role,
        currentOperator: state.currentOperator,
        selectedClass: state.selectedClass,
        selectedClient: state.selectedClient,
        activeView: state.activeView
      };
      const prevStorageFlag = isApplyingStorageState;
      isApplyingStorageState = true;

      try {
        teacherNames.forEach(name => {
          state.role = "teacher";
          state.currentOperator = name;
          syncToolbarSelectors();
          fillFilters();
          const expectedClass = getTeacherClassByName(name);
          mark(state.currentOperator === name, `切換教保員 ${name} 不跳號`);
          if (expectedClass) {
            mark(state.selectedClass === expectedClass, `教保員 ${name} 班級綁定`, `${state.selectedClass}`);
          }
        });
      } catch (err) {
        mark(false, "角色切換流程執行", String(err && err.message ? err.message : err));
      } finally {
        state.role = snapshot.role;
        state.currentOperator = snapshot.currentOperator;
        state.selectedClass = snapshot.selectedClass;
        state.selectedClient = snapshot.selectedClient;
        state.activeView = snapshot.activeView;
        isApplyingStorageState = prevStorageFlag;
        syncToolbarSelectors();
        fillFilters();
      }

      renderMobile();
      const linkHrefs = mobileLinks.length ? mobileLinks.map(a => a.href) : Array.from(document.querySelectorAll("#view-mobile a.btn")).map(a => a.href);
      const uniqueHrefs = Array.from(new Set(linkHrefs));
      mark(linkHrefs.length >= 2, "手機/平板連結存在", `${linkHrefs.length} 個`);
      mark(uniqueHrefs.length === 1, "手機/平板連結一致", uniqueHrefs[0] || "");

      const summary = `QA 快速驗收：${fails.length ? "未通過" : "全部通過"}（${fails.length} 項失敗）`;
      lines.unshift(summary);

      const output = lines.join("\n");
      const box = document.getElementById("qaSmokeResult");
      if (box) box.textContent = output;

      if (fails.length) {
        alert(`${summary}\n請查看設定頁檢查結果。`);
      } else {
        alert(`${summary}\n可進入正式驗收。`);
      }
      log("QA 快速驗收", `${fails.length ? "未通過" : "通過"} / 失敗 ${fails.length} 項`);
    }

    function renderLogs() {
      const host = document.getElementById("view-logs");
      host.innerHTML = `
        <div class="card">
          <h3>操作紀錄（按鍵已可操作）</h3>
          <table>
            <thead><tr><th>時間</th><th>角色</th><th>操作者</th><th>動作</th><th>內容</th></tr></thead>
            <tbody>
              ${state.logs.map(l => `<tr><td>${l.time}</td><td>${l.role}</td><td>${l.actor || "-"}</td><td>${l.action}</td><td>${l.detail}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderMobile() {
      const host = document.getElementById("view-mobile");
      const targetClient = state.selectedClient === "全部個案" ? "王小明" : state.selectedClient;
      const publicEntryUrl = new URL("./", location.href).href;
      host.innerHTML = `
        <div class="card">
          <h3>手機 App 介面預覽</h3>
          <p class="mini">正式入口（手機 / 平板一致）：<a href="${publicEntryUrl}" target="_blank" rel="noopener">${publicEntryUrl}</a></p>
          <div class="actions" style="margin-bottom:8px;">
            <a class="btn" href="${publicEntryUrl}" target="_blank" rel="noopener">手機連結</a>
            <a class="btn" href="${publicEntryUrl}" target="_blank" rel="noopener">平板連結</a>
          </div>
          <div class="mobile-shell">
            <div class="mobile-head">${targetClient}｜每日紀錄</div>
            <div class="mobile-body" id="mobileContent">
              <p>□ 擦桌子</p>
              <p>□ 倒垃圾</p>
              <p>□ 放水杯</p>
              <p>□ 洗手</p>
              <button class="btn primary" style="width:100%;">儲存</button>
            </div>
            <div class="mobile-nav">
              <button data-mobile-tab="home">首頁</button>
              <button data-mobile-tab="record">紀錄</button>
              <button data-mobile-tab="token">代幣</button>
              <button data-mobile-tab="report">報告</button>
            </div>
          </div>
        </div>
      `;

      const panes = {
        home: "<p>今日完成率 91%</p><p>今日代幣 162</p>",
        record: "<p>□ 擦桌子</p><p>□ 倒垃圾</p><p>□ 洗手</p><button class='btn primary' style='width:100%;'>儲存</button>",
        token: "<p>目前代幣：68</p><p>可兌換：餅乾(10)</p>",
        report: "<p>七月成果報告</p><p>完成率 95%</p><p>ISP 分析已產生</p>"
      };

      host.querySelectorAll("[data-mobile-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          host.querySelector("#mobileContent").innerHTML = panes[btn.dataset.mobileTab];
        });
      });
    }

    function isDemoClient(client) {
      if (!client || typeof client !== "object") return false;
      const name = String(client.name || "").trim();
      const notes = String(client.notes || "").trim();
      const owner = String(client.createdBy || client.created_by || "").trim();
      const demoNames = new Set(["王小明", "王小華", "李○○", "陳○○", "林○○"]);
      if (notes.includes("示範資料")) return true;
      return demoNames.has(name) && (!owner || owner === "管理員");
    }

    function purgeDemoDataFromState() {
      const demoClientNames = new Set(
        state.clients
          .filter(isDemoClient)
          .map(c => String(c.name || "").trim())
          .filter(Boolean)
      );
      if (!demoClientNames.size) {
        return { removedClients: 0, removedRows: 0, names: [] };
      }

      const beforeClients = state.clients.length;
      state.clients = state.clients.filter(c => !demoClientNames.has(String(c.name || "").trim()));

      let removedRows = 0;
      Object.entries(state).forEach(([key, value]) => {
        if (!Array.isArray(value)) return;
        const before = value.length;
        state[key] = value.filter(item => {
          if (!item || typeof item !== "object") return true;
          const n1 = String(item.clientName || "").trim();
          const n2 = String(item.client_name || "").trim();
          if (n1 && demoClientNames.has(n1)) return false;
          if (n2 && demoClientNames.has(n2)) return false;
          return true;
        });
        removedRows += (before - state[key].length);
      });

      if (demoClientNames.has(state.selectedClient)) state.selectedClient = "全部個案";
      if (demoClientNames.has(state.selectedIspForEdit)) state.selectedIspForEdit = null;

      return {
        removedClients: beforeClients - state.clients.length,
        removedRows,
        names: Array.from(demoClientNames)
      };
    }

    async function purgeDemoDataAndSync(buttonEl) {
      if (state.role === "teacher") {
        alert("教保員不可執行此操作");
        return;
      }

      const confirmed = confirm("確定要清除範例資料並同步到雲端嗎？此操作不會影響非範例資料。");
      if (!confirmed) return;

      const btn = buttonEl || document.getElementById("purgeDemoDataBtn");
      const originalText = btn ? btn.textContent : "";
      if (btn) {
        btn.disabled = true;
        btn.textContent = "清除中...";
      }

      try {
        const result = purgeDemoDataFromState();
        if (!result.removedClients && !result.removedRows) {
          alert("未找到可清除的範例資料");
          return;
        }
        log("清除範例資料", `個案 ${result.removedClients} 筆，關聯資料 ${result.removedRows} 筆`);
        renderAll();
        await pushCloudState();
        setSyncStatus(`範例資料已清除並同步（${nowClock()}）`);
        alert(`範例資料清除完成：個案 ${result.removedClients} 筆，關聯資料 ${result.removedRows} 筆`);
      } catch (err) {
        console.warn("清除範例資料失敗", err);
        alert("清除範例資料失敗，請稍後再試");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = originalText || "清除範例資料（本機 + 雲端）";
        }
      }
    }

    function backupData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `smart-care-backup-${today()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      log("備份資料", "已下載 JSON 備份檔");
    }

    function exportExcel() {
      const rows = state.records.map(r => ({
        日期: r.date,
        班級: r.className,
        個案: r.clientName,
        工作: r.taskName,
        完成: r.completed ? "是" : "否",
        提示層級: r.prompt,
        品質: r.quality,
        代幣給予: r.tokenAward,
        品質回扣: r.tokenDeduct,
        行為事件: r.behaviorEvent,
        處理方式: r.handling,
        結果: r.result
      }));

      if (window.XLSX) {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, "每日紀錄");
        XLSX.writeFile(wb, `smart-care-records-${today()}.xlsx`);
      } else {
        const header = Object.keys(rows[0] || { 日期: "", 班級: "" });
        const csv = [header.join(","), ...rows.map(r => header.map(h => `"${String(r[h] || "").replace(/"/g, '""')}"`).join(","))].join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `smart-care-records-${today()}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      log("匯出 Excel", "已匯出每日紀錄（避免中文亂碼）");
    }

    async function exportPdf() {
      const preview = document.getElementById("reportPreviewPages");
      if (!preview) return;
      const pages = preview.querySelectorAll(".report-page");
      if (!pages.length) return;
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "mm", "a4");
      const pageWidth = 210;
      const pageHeight = 297;

      for (let i = 0; i < pages.length; i++) {
        const pageEl = pages[i];
        const canvas = await html2canvas(pageEl, { scale: 2, backgroundColor: "#ffffff" });
        const img = canvas.toDataURL("image/png");
        const ratio = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
        const w = canvas.width * ratio;
        const h = canvas.height * ratio;
        if (i > 0) pdf.addPage();
        pdf.addImage(img, "PNG", 0, 8, w, h);
      }

      pdf.save(`smart-care-report-${today()}.pdf`);
      log("匯出 PDF", `已產生 PDF（${pages.length} 頁，依報告收集區排序）`);
    }

    init();
  </script>
</body>
