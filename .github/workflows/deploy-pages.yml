name: Deploy Cloudflare + GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_cloudflare_secrets: ${{ steps.cf_secrets.outputs.has_cloudflare_secrets }}
    steps:
      - name: Check Cloudflare secrets presence
        id: cf_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "has_cloudflare_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets detected. Worker + D1 deploy will run."
          else
            echo "has_cloudflare_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing. Skipping Worker + D1 deploy; continuing GitHub Pages deploy."
          fi

  deploy-cloudflare:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_cloudflare_secrets == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply D1 schema
        run: |
          npx --yes wrangler d1 execute smart-care-sync \
            --remote \
            --file cloudflare/schema.sql \
            --config cloudflare/wrangler.toml

      - name: Deploy Cloudflare Worker
        run: |
          chmod +x scripts/deploy-cloudflare.sh scripts/cloudflare-healthcheck.sh
          ./scripts/deploy-cloudflare.sh --verify-public --verbose

  deploy-pages:
    needs:
      - preflight
      - deploy-cloudflare
    if: ${{ always() && (needs.preflight.outputs.has_cloudflare_secrets == 'false' || needs.deploy-cloudflare.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
